<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#05070d">
<title>BLACKSITE // Mission Control</title>

<style>
:root{
  --bg:#05070d;
  --panel:#0b101b;
  --panel2:#101827;
  --line:#1d2b42;
  --text:#edf5ff;
  --muted:#8291a8;
  --cyan:#00e5ff;
  --green:#39ff88;
  --red:#ff3b5c;
  --orange:#ffb52e;
  --purple:#a86cff;
  --blue:#4287ff;
  --shadow:0 20px 60px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow-x:hidden}

button,input,textarea,select{font:inherit}
button{cursor:pointer}

#app{
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 0%,rgba(0,229,255,.07),transparent 30%),
    radial-gradient(circle at 100% 100%,rgba(168,108,255,.06),transparent 35%),
    var(--bg);
}

.hidden{display:none!important}

.topbar{
  position:sticky;
  top:0;
  z-index:50;
  height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  background:rgba(5,7,13,.9);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:900;
  letter-spacing:2px;
}

.logo{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  border:1px solid var(--cyan);
  color:var(--cyan);
  box-shadow:0 0 22px rgba(0,229,255,.2);
}

.status{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--muted);
  font-size:12px;
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:var(--red);
}

.dot.online{
  background:var(--green);
  box-shadow:0 0 12px var(--green);
}

.screen{
  width:min(1500px,100%);
  margin:auto;
  padding:24px;
}

.hero{
  min-height:calc(100vh - 68px);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.heroBox{
  width:min(900px,100%);
}

.kicker{
  color:var(--cyan);
  font-weight:900;
  letter-spacing:4px;
  font-size:12px;
}

h1{
  font-size:clamp(42px,8vw,90px);
  line-height:.9;
  margin:16px 0;
  letter-spacing:-4px;
}

h2{
  margin:0 0 12px;
}

.subtitle{
  color:var(--muted);
  font-size:17px;
  max-width:700px;
  margin:0 auto 28px;
  line-height:1.6;
}

.bigActions{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:12px;
}

.btn{
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
  padding:13px 18px;
  border-radius:12px;
  font-weight:800;
  transition:.15s;
}

.btn:hover{
  transform:translateY(-2px);
  border-color:var(--cyan);
}

.btn.primary{
  background:var(--cyan);
  color:#001015;
  border-color:var(--cyan);
}

.btn.green{
  background:var(--green);
  color:#001108;
}

.btn.red{
  background:var(--red);
  color:white;
}

.btn.orange{
  background:var(--orange);
  color:#170d00;
}

.btn.purple{
  background:var(--purple);
  color:white;
}

.btn.small{
  padding:8px 11px;
  font-size:12px;
}

.grid{
  display:grid;
  gap:16px;
}

.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}

.card{
  background:linear-gradient(145deg,var(--panel),#080d16);
  border:1px solid var(--line);
  border-radius:18px;
  padding:18px;
  box-shadow:var(--shadow);
}

.cardTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.muted{color:var(--muted)}
.cyan{color:var(--cyan)}
.greenText{color:var(--green)}
.redText{color:var(--red)}
.orangeText{color:var(--orange)}

input,textarea,select{
  width:100%;
  color:var(--text);
  background:#070c15;
  border:1px solid var(--line);
  border-radius:11px;
  padding:12px;
  outline:none;
}

input:focus,textarea:focus,select:focus{
  border-color:var(--cyan);
  box-shadow:0 0 0 2px rgba(0,229,255,.08);
}

textarea{
  min-height:110px;
  resize:vertical;
}

label{
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:800;
  margin:0 0 7px;
  text-transform:uppercase;
  letter-spacing:1px;
}

.field{margin-bottom:15px}

.roomCode{
  font-size:42px;
  letter-spacing:10px;
  font-weight:1000;
  color:var(--cyan);
  text-align:center;
  padding:16px;
  border:1px dashed var(--cyan);
  border-radius:15px;
  background:rgba(0,229,255,.04);
}

.modePill{
  display:inline-flex;
  padding:6px 10px;
  border-radius:999px;
  font-size:11px;
  font-weight:900;
  border:1px solid var(--line);
}

.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:8px;
  margin-bottom:18px;
}

.tab{
  white-space:nowrap;
  background:var(--panel);
  color:var(--muted);
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px 14px;
  font-weight:800;
}

.tab.active{
  color:var(--cyan);
  border-color:var(--cyan);
}

.stat{
  text-align:center;
}

.statNum{
  font-size:32px;
  font-weight:1000;
}

.statLabel{
  color:var(--muted);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1px;
}

.missionTypes{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.missionType{
  position:relative;
  min-height:120px;
  text-align:left;
  border:1px solid var(--line);
  border-radius:15px;
  background:#080d16;
  color:var(--text);
  padding:15px;
  transition:.18s;
}

.missionType:hover{
  transform:translateY(-3px);
  border-color:var(--cyan);
}

.missionType.selected{
  border-color:var(--cyan);
  background:rgba(0,229,255,.07);
  box-shadow:0 0 30px rgba(0,229,255,.08);
}

.typeIcon{
  font-size:30px;
  margin-bottom:8px;
}

.typeName{
  font-weight:1000;
}

.typeDesc{
  color:var(--muted);
  font-size:11px;
  margin-top:5px;
}

.choiceRow{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.choice{
  border:1px solid var(--line);
  background:#080d16;
  color:var(--muted);
  border-radius:10px;
  padding:9px 13px;
  font-weight:800;
}

.choice.selected{
  color:var(--text);
  border-color:var(--cyan);
  background:rgba(0,229,255,.08);
}

.preview{
  min-height:500px;
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(180deg,rgba(0,229,255,.04),transparent 35%),
    #050912;
}

.previewHeader{
  padding:22px;
  border-bottom:1px solid var(--line);
}

.previewMissionType{
  color:var(--cyan);
  font-size:11px;
  letter-spacing:3px;
  font-weight:900;
}

.previewTitle{
  font-size:35px;
  font-weight:1000;
  margin:10px 0;
}

.previewBody{
  padding:22px;
}

.objectiveItem{
  display:flex;
  gap:10px;
  align-items:center;
  border:1px solid var(--line);
  border-radius:10px;
  padding:11px;
  margin-bottom:8px;
  background:#080d16;
}

.objectiveItem input{
  width:auto;
}

.clue{
  border-left:3px solid var(--purple);
  background:rgba(168,108,255,.06);
  padding:12px;
  border-radius:8px;
  margin-top:8px;
}

.deployZone{
  position:sticky;
  bottom:0;
  z-index:20;
  padding:14px;
  margin-top:18px;
  border:1px solid var(--line);
  border-radius:16px;
  background:rgba(7,12,21,.94);
  backdrop-filter:blur(15px);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.chat{
  height:420px;
  display:flex;
  flex-direction:column;
}

.messages{
  flex:1;
  overflow:auto;
  padding:5px;
}

.msg{
  margin-bottom:10px;
  padding:10px 12px;
  border-radius:11px;
  background:#080d16;
  border:1px solid var(--line);
}

.msg b{
  color:var(--cyan);
  font-size:12px;
}

.msgText{
  margin-top:3px;
  line-height:1.4;
}

.chatInput{
  display:flex;
  gap:8px;
  margin-top:8px;
}

.agent{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  border:1px solid var(--line);
  padding:11px;
  border-radius:11px;
  margin-bottom:8px;
}

.agentName{
  font-weight:900;
}

.agentStatus{
  font-size:11px;
  color:var(--green);
}

.bigMission{
  max-width:1000px;
  margin:auto;
}

.missionHero{
  text-align:center;
  padding:35px 10px;
}

.missionIcon{
  font-size:70px;
}

.missionTitle{
  font-size:clamp(36px,7vw,75px);
  font-weight:1000;
  letter-spacing:-3px;
}

.missionBriefing{
  max-width:760px;
  margin:20px auto;
  color:#b5c2d6;
  font-size:17px;
  line-height:1.7;
}

.timer{
  font-size:clamp(60px,13vw,130px);
  font-weight:1000;
  text-align:center;
  font-variant-numeric:tabular-nums;
  letter-spacing:-5px;
}

.timer.warning{color:var(--orange)}
.timer.danger{
  color:var(--red);
  animation:pulse .7s infinite alternate;
}

@keyframes pulse{
  to{transform:scale(1.03);text-shadow:0 0 30px var(--red)}
}

.progress{
  height:12px;
  background:#080d16;
  border:1px solid var(--line);
  border-radius:999px;
  overflow:hidden;
}

.progressBar{
  height:100%;
  width:0%;
  background:var(--cyan);
  transition:.3s;
}

.bigStatus{
  text-align:center;
  font-size:20px;
  font-weight:1000;
  padding:20px;
}

.modal{
  position:fixed;
  inset:0;
  z-index:200;
  display:grid;
  place-items:center;
  padding:18px;
  background:rgba(0,0,0,.8);
  backdrop-filter:blur(12px);
}

.modalBox{
  width:min(650px,100%);
  max-height:90vh;
  overflow:auto;
  background:#090e18;
  border:1px solid var(--line);
  border-radius:20px;
  padding:22px;
}

.callOverlay{
  position:fixed;
  inset:0;
  z-index:500;
  display:grid;
  place-items:center;
  background:rgba(0,0,0,.86);
}

.callBox{
  width:min(400px,90%);
  text-align:center;
  padding:30px;
  border:1px solid var(--cyan);
  background:#080d16;
  border-radius:24px;
  box-shadow:0 0 80px rgba(0,229,255,.15);
}

.callIcon{
  width:90px;
  height:90px;
  margin:auto;
  display:grid;
  place-items:center;
  border-radius:50%;
  border:2px solid var(--cyan);
  font-size:40px;
  animation:ring 1.2s infinite;
}

@keyframes ring{
  50%{box-shadow:0 0 0 18px rgba(0,229,255,.03),0 0 0 35px rgba(0,229,255,.02)}
}

#effectLayer{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:1000;
}

.scanlines{
  background:repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,.03) 0,
    rgba(255,255,255,.03) 1px,
    transparent 1px,
    transparent 4px
  );
}

.flash{
  background:white;
  animation:flash .3s;
}

@keyframes flash{
  from{opacity:1}
  to{opacity:0}
}

.glitch{
  animation:glitch .35s infinite;
}

@keyframes glitch{
  0%,100%{transform:none}
  20%{transform:translate(4px,-2px)}
  40%{transform:translate(-3px,2px)}
  60%{transform:translate(2px,1px)}
  80%{transform:translate(-1px,-2px)}
}

.shake{
  animation:shake .35s;
}

@keyframes shake{
  20%{transform:translate(8px)}
  40%{transform:translate(-8px)}
  60%{transform:translate(5px)}
  80%{transform:translate(-5px)}
}

.activity{
  max-height:350px;
  overflow:auto;
}

.activityItem{
  padding:9px;
  border-bottom:1px solid var(--line);
  font-size:12px;
}

.empty{
  text-align:center;
  padding:30px;
  color:var(--muted);
}

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  z-index:2000;
  background:#101827;
  border:1px solid var(--cyan);
  border-radius:999px;
  padding:11px 18px;
  box-shadow:var(--shadow);
}

@media(max-width:850px){
  .grid2,.grid3,.grid4{grid-template-columns:1fr}
  .missionTypes{grid-template-columns:repeat(2,1fr)}
  .screen{padding:14px}
  .topbar{padding:0 12px}
  .deployZone{flex-direction:column;align-items:stretch}
}

@media(max-width:500px){
  .missionTypes{grid-template-columns:1fr}
  .brand span{display:none}
}
</style>
</head>

<body>

<div id="app"></div>
<div id="effectLayer"></div>

<script type="module">

/* ============================================================
   BLACKSITE // MISSION CONTROL
   SINGLE-FILE FIREBASE PROJECT
   ============================================================

   IMPORTANT:
   The Firebase configuration is intentionally NOT hard-coded.

   This prevents GitHub from detecting your Google API key in
   this public repository.

   On first launch, use the Firebase Setup button and paste your
   Firebase web configuration there.

   It is stored locally on the current device only.
   ============================================================ */

import { initializeApp, getApps } from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  set,
  update,
  push,
  onValue,
  get,
  remove
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* ============================================================
   STATE
   ============================================================ */

const state = {
  app:null,
  auth:null,
  db:null,
  user:null,
  room:null,
  role:null,
  roomData:null,
  timer:null,
  audio:null,
  audioEnabled:false,
  currentTab:"mission",
  composer:{
    type:"recon",
    difficulty:"medium",
    title:"Operation Nightfall",
    briefing:"",
    objectives:[],
    clues:[],
    countdown:300,
    success:"Complete all objectives",
    failure:"Timer reaches zero"
  }
};

const missionTypes = {
  recon:{
    icon:"🛰️",
    name:"RECON",
    desc:"Locate, observe and report."
  },
  extraction:{
    icon:"🚨",
    name:"EXTRACTION",
    desc:"Reach the target and extract safely."
  },
  investigation:{
    icon:"🔎",
    name:"INVESTIGATION",
    desc:"Follow evidence and uncover the truth."
  },
  escort:{
    icon:"🛡️",
    name:"ESCORT",
    desc:"Protect the assigned target."
  },
  survival:{
    icon:"☢️",
    name:"SURVIVAL",
    desc:"Stay operational until time expires."
  },
  covert:{
    icon:"🕶️",
    name:"COVERT",
    desc:"Complete the objective without detection."
  }
};


/* ============================================================
   UTILITIES
   ============================================================ */

const $ = id => document.getElementById(id);

function esc(v=""){
  return String(v)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function uid(){
  return Math.random().toString(36).slice(2,9).toUpperCase();
}

function roomCode(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let x="";
  for(let i=0;i<5;i++)
    x+=chars[Math.floor(Math.random()*chars.length)];
  return x;
}

function now(){
  return Date.now();
}

function toast(text){
  const old=document.querySelector(".toast");
  if(old)old.remove();

  const t=document.createElement("div");
  t.className="toast";
  t.textContent=text;
  document.body.appendChild(t);

  setTimeout(()=>t.remove(),2500);
}

function effect(type){
  const layer=$("effectLayer");
  layer.className="";

  if(type==="scanlines"){
    layer.className="scanlines";
  }

  if(type==="flash"){
    layer.className="flash";
    setTimeout(()=>layer.className="",350);
  }

  if(type==="glitch"){
    document.body.classList.add("glitch");
    setTimeout(()=>document.body.classList.remove("glitch"),1200);
  }

  if(type==="shake"){
    document.body.classList.add("shake");
    setTimeout(()=>document.body.classList.remove("shake"),500);
  }
}

function formatTime(sec){
  sec=Math.max(0,Math.floor(sec));
  const m=Math.floor(sec/60);
  const s=sec%60;
  return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}


/* ============================================================
   FIREBASE SETUP
   ============================================================ */

function savedConfig(){
  try{
    return JSON.parse(localStorage.getItem("blacksiteFirebaseConfig")||"null");
  }catch{
    return null;
  }
}

function saveConfig(config){
  localStorage.setItem(
    "blacksiteFirebaseConfig",
    JSON.stringify(config)
  );
}

async function setupFirebase(config){

  try{

    state.app =
      getApps().length
      ? getApps()[0]
      : initializeApp(config);

    state.auth=getAuth(state.app);
    state.db=getDatabase(state.app);

    await signInAnonymously(state.auth);

    onAuthStateChanged(state.auth,user=>{
      state.user=user;
      updateConnection(true);
    });

    return true;

  }catch(err){

    console.error(err);

    alert(
      "Firebase setup failed.\n\n"+
      err.message+
      "\n\nMake sure Anonymous Authentication and Realtime Database are enabled."
    );

    return false;
  }
}

function updateConnection(online){

  const dot=document.querySelector(".dot");
  if(dot){
    dot.classList.toggle("online",online);
  }
}

function showFirebaseSetup(){

  document.body.insertAdjacentHTML("beforeend",`
    <div class="modal" id="firebaseModal">
      <div class="modalBox">

        <h2>⚙️ Firebase Connection</h2>

        <p class="muted">
          Paste your Firebase Web App configuration below.
          This is saved only on this device and is NOT written
          into your GitHub file.
        </p>

        <div class="field">
          <label>Firebase Config JSON</label>
          <textarea id="firebaseInput"
            placeholder='{"apiKey":"...","authDomain":"...","databaseURL":"...","projectId":"...","storageBucket":"...","messagingSenderId":"...","appId":"..."}'></textarea>
        </div>

        <div class="bigActions">
          <button class="btn primary" id="connectFirebase">
            CONNECT
          </button>

          <button class="btn" id="cancelFirebase">
            CANCEL
          </button>
        </div>

      </div>
    </div>
  `);

  $("firebaseInput").value =
    JSON.stringify(savedConfig()||{},null,2);

  $("cancelFirebase").onclick=()=>{
    $("firebaseModal").remove();
  };

  $("connectFirebase").onclick=async()=>{

    try{

      const cfg=JSON.parse($("firebaseInput").value);

      if(!cfg.apiKey || !cfg.projectId){
        throw new Error("That doesn't look like a Firebase config.");
      }

      saveConfig(cfg);

      $("firebaseModal").remove();

      const ok=await setupFirebase(cfg);

      if(ok){
        toast("Firebase connected.");
        boot();
      }

    }catch(err){
      alert(err.message);
    }
  };
}


/* ============================================================
   LANDING
   ============================================================ */

function landing(){

  $("app").innerHTML=`

    <div class="topbar">
      <div class="brand">
        <div class="logo">◈</div>
        <span>BLACKSITE // HQ</span>
      </div>

      <div class="status">
        <span class="dot"></span>
        OFFLINE
      </div>
    </div>

    <main class="hero">
      <div class="heroBox">

        <div class="kicker">
          CLASSIFIED OPERATIONS NETWORK
        </div>

        <h1>MISSION<br>CONTROL</h1>

        <p class="subtitle">
          Build cinematic missions, command agents,
          transmit live orders, run remote DJ sequences,
          and operate your own digital HQ.
        </p>

        <div class="bigActions">

          <button class="btn primary" id="createRoom">
            CREATE HQ
          </button>

          <button class="btn" id="joinRoom">
            JOIN ROOM
          </button>

          <button class="btn" id="firebaseSetup">
            FIREBASE SETUP
          </button>

        </div>

        <div style="margin-top:25px;color:#58677d;font-size:11px">
          CONSENT-BASED SIMULATION // NO REAL DEVICE CONTROL
        </div>

      </div>
    </main>
  `;

  $("createRoom").onclick=async()=>{
    if(!state.db){
      showFirebaseSetup();
      return;
    }

    await createRoom();
  };

  $("joinRoom").onclick=async()=>{
    if(!state.db){
      showFirebaseSetup();
      return;
    }

    joinDialog();
  };

  $("firebaseSetup").onclick=showFirebaseSetup;
}

   ============================================================ */

async function createRoom(){

  const code=roomCode();

  state.room=code;
  state.role="control";

  await set(ref(state.db,"rooms/"+code),{
    createdAt:now(),
    creator:state.user.uid,
    status:"lobby",
    players:{},
    chat:{},
    mission:null,
    call:null,
    dj:null,
    effects:{},
    activity:{}
  });

  await addActivity("HQ created room "+code);

  controlScreen();
}

function joinDialog(){

  document.body.insertAdjacentHTML("beforeend",`

    <div class="modal" id="joinModal">
      <div class="modalBox">

        <h2>JOIN OPERATION</h2>

        <p class="muted">
          Enter the five-character room code from HQ.
        </p>

        <div class="field">
          <label>Room Code</label>
          <input id="joinCode"
                 maxlength="5"
                 autocomplete="off"
                 placeholder="ABCDE"
                 style="font-size:28px;text-align:center;letter-spacing:7px">
        </div>

        <div class="field">
          <label>Agent Name</label>
          <input id="agentName"
                 maxlength="24"
                 placeholder="Agent Phoenix">
        </div>

        <div class="bigActions">
          <button class="btn primary" id="joinNow">
            ENTER HQ
          </button>

          <button class="btn" onclick="document.getElementById('joinModal').remove()">
            CANCEL
          </button>
        </div>

      </div>
    </div>
  `);

  $("joinNow").onclick=async()=>{

    const code=$("joinCode").value.trim().toUpperCase();
    const name=$("agentName").value.trim()||"Unknown Agent";

    if(code.length!==5){
      alert("Enter the 5-character room code.");
      return;
    }

    const snap=await get(ref(state.db,"rooms/"+code));

    if(!snap.exists()){
      alert("Room not found.");
      return;
    }

    state.room=code;
    state.role="normal";

    const playerId=state.user.uid;

    await set(
      ref(state.db,
      `rooms/${code}/players/${playerId}`),
      {
        name,
        joinedAt:now(),
        status:"READY"
      }
    );

    $("joinModal").remove();

    await addActivity(name+" joined the operation.");

    normalScreen();
  };
}

async function sendChat(name,text){

  await push(
    ref(state.db,

    {

      text,
      at:now()

  );

function renderMessages(){

  const messages=state.roomData?.chat||{};

  const arr=Object.values(messages)

  el.innerHTML=
    arr.length

      <div class="msg">

        <div class="msgText">
          ${esc(m.text)}

function subscribeAgent(){

  onValue(
    ref(state.db,"rooms/"+state.room),
    snap=>{

      if(!snap.exists())return;

      const old=state.roomData;

      state.roomData=snap.val();

      if(
        old?.dj?.at !==
        state.roomData?.dj?.at
      ){
        handleDJ(state.roomData.dj);
      }

      if(
        old?.call?.at !==
        state.roomData?.call?.at
      ){
        showIncomingCall(state.roomData.call);
      }

      if(
        old?.effects?.at !==
        state.roomData?.effects?.at
      ){
        if(state.roomData.effects)
          effect(state.roomData.effects.type);
      }

      renderAgentContent();

    }
  );
}

/* ============================================================
   MISSION TIMER
   ============================================================ */

let timerMissionId=null;
let timerStart=null;

function startMissionTimer(m){

  if(timerMissionId===m.id &&
     timerStart===m.deployedAt){
    return;
  }

  timerMissionId=m.id;
  timerStart=m.deployedAt;

  clearInterval(state.timer);

  const end=
    m.deployedAt+
    (Number(m.countdown)||0)*1000;

  const tick=async()=>{

    const el=$("missionTimer");

    if(!el)return;

    const remaining=
      Math.max(0,Math.ceil((end-now())/1000));

    el.textContent=formatTime(remaining);

    el.classList.remove("warning","danger");

    if(remaining<=60)
      el.classList.add("danger");
    else if(remaining<=120)
      el.classList.add("warning");

    if(remaining<=0){

      clearInterval(state.timer);

      if(m.status==="ACTIVE"){

        await update(
          ref(
            state.db,
            `rooms/${state.room}/mission`
          ),
          {
            status:"FAILED"
          }
        );

        effect("shake");
      }
    }

  };

  tick();

  state.timer=setInterval(tick,1000);
}


/* ============================================================
   AUDIO ENGINE
   ============================================================ */

function unlockAudio(){

  if(state.audio)return;

  try{

    state.audio=
      new (window.AudioContext||
           window.webkitAudioContext)();

    state.audio.resume();

  }catch(err){
    console.log(err);
  }
}

function playTone(type){

  unlockAudio();

  if(!state.audio)return;

  const ctx=state.audio;

  const osc=ctx.createOscillator();
  const gain=ctx.createGain();

  osc.connect(gain);
  gain.connect(ctx.destination);

  const t=ctx.currentTime;

  let freq=440;

  if(type==="test")freq=660;
  if(type==="alert")freq=880;
  if(type==="bass")freq=90;
  if(type==="siren")freq=500;

  osc.frequency.setValueAtTime(freq,t);

  if(type==="siren"){
    osc.frequency.exponentialRampToValueAtTime(
      1000,t+.35
    );
    osc.frequency.exponentialRampToValueAtTime(
      350,t+.7
    );
  }

  gain.gain.setValueAtTime(.0001,t);
  gain.gain.exponentialRampToValueAtTime(.25,t+.02);
  gain.gain.exponentialRampToValueAtTime(.0001,t+.8);

  osc.start(t);
  osc.stop(t+.82);
}

function handleDJ(dj){

  if(!dj)return;

  if(dj.action==="play"){

    if(!state.audioEnabled){
      toast("HQ sent audio. Tap ENABLE AUDIO first.");
      return;
    }

    playTone(
      dj.sound==="alert"
      ?"alert"
      :dj.sound==="bass"
      ?"bass"
      :dj.sound==="siren"
      ?"siren"
      :"test"
    );
  }

  if(dj.action==="stop"){
    /* browser audio is intentionally simple */
  }
}

}


/* ============================================================
   BOOT
   ============================================================ */

async function boot(){

  const config=savedConfig();

  if(!config){

    landing();
    return;
  }

  if(!state.db){

    const ok=await setupFirebase(config);

    if(!ok){
      landing();
      return;
    }
  }

  const params=
    new URLSearchParams(location.search);

  const path=
    location.pathname.toLowerCase();

  /*
    Both systems are supported:

      ?mode=control
      ?mode=normal

    and:

      /control
      /normal

    Query parameters are more reliable on GitHub Pages.
  */

  const mode=
    params.get("mode")||
    (
      path.endsWith("/control")
      ?"control"
      :
      path.endsWith("/normal")
      ?"normal"
      :""
    );

  if(mode==="control"){
    landing();
    return;
  }

  if(mode==="normal"){
    landing();
    return;
  }

  landing();
}


/* ============================================================
   START
   ============================================================ */

boot();
