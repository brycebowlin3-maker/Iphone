/* =========================================================

========================================================= */
function $(id){
  return document.getElementById(id);
}
function esc(value){
  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
function randomCode(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let result="";
  for(let i=0;i<5;i++){
    result += chars[Math.floor(Math.random()*chars.length)];
  }
  return result;
}
function timeText(timestamp){
  if(!timestamp) return "—";
  return new Date(timestamp).toLocaleTimeString([],{
    hour:"numeric",
    minute:"2-digit",
    second:"2-digit"
  });
}
function toast(message){
  const t=$("toast");
  if(!t)return;
  t.textContent=message;
  t.classList.remove("hidden");
  clearTimeout(window.__toast);
  window.__toast=setTimeout(()=>{
    t.classList.add("hidden");
  },2300);
}
function capitalize(x){
  return x.charAt(0).toUpperCase()+x.slice(1);
}
function roomRef(path=""){
  return ref(
    db,
    `rooms/${roomCode}${path ? "/"+path : ""}`
  );
}

async function createRoom(){
  try{
    let code=randomCode();
    let snapshot=
      await get(ref(db,`rooms/${code}`));
    while(snapshot.exists()){
      code=randomCode();
      snapshot=
        await get(ref(db,`rooms/${code}`));
    }
    roomCode=code;
    await set(roomRef(),{
      createdAt:Date.now(),
      creator:user.uid,
      status:"LOBBY",
      mission:null,
      players:{},
      chat:{},
      command:null,
      effect:null,
      sound:null,
      call:null,
      settings:{
        locked:false
      },
      activity:{
        first:{
          text:"HQ created",
          time:Date.now()
        }
      }
    });
    openControl();
  }catch(error){
    alert(error.message);
  }
}

async function joinRoom(){
  const name=$("agentNameInput").value.trim();
  const code=$("roomInput").value
    .trim()
    .toUpperCase();
  if(!name){
    $("agentStartError").innerHTML=
      `<div class="error">Enter an agent name.</div>`;
    return;
  }
  if(code.length!==5){
    $("agentStartError").innerHTML=
      `<div class="error">Enter the 5-character HQ code.</div>`;
    return;
  }
  try{
    const snapshot=
      await get(ref(db,`rooms/${code}`));
    if(!snapshot.exists())
      throw new Error("HQ not found.");
    const data=snapshot.val();
    if(data.settings?.locked)
      throw new Error("This HQ is currently locked.");
    roomCode=code;
    agentName=name;
    await set(
      ref(
        db,
        `rooms/${roomCode}/players/${user.uid}`
      ),
      {
        name,
        role:"AGENT",
        joinedAt:Date.now(),
        online:true,
        uid:user.uid
      }
    );
    onDisconnect(
      ref(db,`rooms/${roomCode}/players/${user.uid}/online`)
    ).set(false);
    await addActivity(
      `${name} joined the HQ`
    );
    openAgent();
  }catch(error){
    $("agentStartError").innerHTML=
      `<div class="error">${esc(error.message)}</div>`;
  }
}

/* =========================================================
   TABS
========================================================= */
function tabButton(id,label){
  return `
    <button
      class="tab ${currentTab===id?'active':''}"
      onclick="switchTab('${id}')">
      ${label}
    </button>
  `;
}
function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll(".tab")
    .forEach(x=>{
      x.classList.toggle(
        "active",
        x.textContent.trim()===tab.toUpperCase()
      );
    });
  renderControl();
}
/* =========================================================
   CONTROL RENDER
========================================================= */

  if(!room)return;
  const content=$("content");
  if(currentTab==="overview")
    content.innerHTML=renderOverview();
  if(currentTab==="missions")
    content.innerHTML=renderMissions();
  if(currentTab==="agents")
    content.innerHTML=renderAgents();
  if(currentTab==="calls")
    content.innerHTML=renderCalls();
  if(currentTab==="chat")
    content.innerHTML=renderChat();
  if(currentTab==="command")
    content.innerHTML=renderCommand();
  if(currentTab==="activity")
    content.innerHTML=renderActivity();
  renderHeaderStatus();
  if(currentTab==="chat")
    scrollChat();
}

async function deployDraft(){

  const briefing=missionDraft.briefing.trim();

    missionDraft.objectives
      .map(x=>x.trim())
      .filter(Boolean);
  const clues=
    missionDraft.clues
      .map(x=>x.trim())
      .filter(Boolean);
  if(!title){
    toast("MISSION NEEDS A TITLE");
    return;

  if(!briefing){

    id:"MISSION_"+Date.now(),

    difficulty:missionDraft.difficulty,

    briefing,
    objectives,
    clues,
    minutes:Number(missionDraft.minutes)||10,
    success:missionDraft.success.trim(),
    failure:missionDraft.failure.trim(),
    deployedAt:Date.now(),

    roomRef(),

/* =========================================================
   WEBRTC CALLING
========================================================= */
async function startCall(targetUid){
  if(targetUid===user.uid)return;
  try{
    await prepareAudio();
    const callId=
      user.uid+"_"+targetUid+"_"+Date.now();
    activeCallId=callId;
    activePeer=targetUid;
    const pc=
      new RTCPeerConnection(STUN_CONFIG);
    peerConnections[targetUid]=pc;
    localStream
      .getTracks()
      .forEach(track=>{
        pc.addTrack(track,localStream);
      });
    pc.onicecandidate=event=>{
      if(event.candidate){
        push(
          ref(
            db,
            `rooms/${roomCode}/calls/${callId}/offerCandidates`
          ),
          event.candidate.toJSON()
        );
      }
    };
    pc.ontrack=event=>{
      attachRemoteAudio(event.streams[0]);
    };
    const offer=await pc.createOffer();
    await pc.setLocalDescription(offer);
    await set(
      ref(db,`rooms/${roomCode}/calls/${callId}`),
      {
        from:user.uid,
        to:targetUid,
        fromName:"COMMAND",
        type:"offer",
        offer:{
          type:offer.type,
          sdp:offer.sdp
        },
        status:"ringing",
        createdAt:Date.now()
      }
    );
    await addActivity(
      `Calling ${room.players?.[targetUid]?.name||"agent"}`
    );
    listenForAnswer(callId,targetUid);
    listenForRemoteCandidates(
      callId,
      "answerCandidates",
      pc
    );
    showCallOverlay(
      "OUTGOING",
      room.players?.[targetUid]?.name||"Agent"
    );
  }catch(error){
    toast("CALL FAILED: "+error.message);
  }
}
function listenForAnswer(callId,targetUid){
  onValue(
    ref(db,`rooms/${roomCode}/calls/${callId}`),
    async snap=>{
      const data=snap.val();
      if(!data)return;
      const pc=peerConnections[targetUid];
      if(
        data.answer &&
        pc &&
        !pc.currentRemoteDescription
      ){
        await pc.setRemoteDescription(
          new RTCSessionDescription(data.answer)
        );
      }
      if(data.status==="ended"){
        cleanupPeer(targetUid);
      }
    }
  );
}
async function receiveCall(callId,data){
  try{
    await prepareAudio();
    const caller=data.from;
    const pc=
      new RTCPeerConnection(STUN_CONFIG);
    peerConnections[caller]=pc;
    activePeer=caller;
    activeCallId=callId;
    localStream
      .getTracks()
      .forEach(track=>{
        pc.addTrack(track,localStream);
      });
    pc.onicecandidate=event=>{
      if(event.candidate){
        push(
          ref(
            db,
            `rooms/${roomCode}/calls/${callId}/answerCandidates`
          ),
          event.candidate.toJSON()
        );
      }
    };
    pc.ontrack=event=>{
      attachRemoteAudio(event.streams[0]);
    };
    await pc.setRemoteDescription(
      new RTCSessionDescription(data.offer)
    );
    const answer=await pc.createAnswer();
    await pc.setLocalDescription(answer);
    await update(
      ref(db,`rooms/${roomCode}/calls/${callId}`),
      {
        answer:{
          type:answer.type,
          sdp:answer.sdp
        },
        status:"connected"
      }
    );
    listenForRemoteCandidates(
      callId,
      "offerCandidates",
      pc
    );
    hideCallOverlay();
    toast("VOICE CHANNEL CONNECTED");
    if(isControl){
      switchTab("calls");
    }
  }catch(error){
    toast("CALL FAILED: "+error.message);
  }
}
function listenForRemoteCandidates(
  callId,
  collection,
  pc
){
  onValue(
    ref(
      db,
      `rooms/${roomCode}/calls/${callId}/${collection}`
    ),
    snap=>{
      const data=snap.val();
      if(!data)return;
      Object.values(data).forEach(candidate=>{
        pc.addIceCandidate(
          new RTCIceCandidate(candidate)
        ).catch(()=>{});
      });
    }
  );
}
async function prepareAudio(){
  if(!localStream){
    localStream=
      await navigator.mediaDevices.getUserMedia({
        audio:{
          echoCancellation:true,
          noiseSuppression:true,
          autoGainControl:true
        },
        video:false
      });
  }
}
function attachRemoteAudio(stream){
  let audio=document.getElementById("remoteAudio");
  if(!audio){
    audio=document.createElement("audio");
    audio.id="remoteAudio";
    audio.autoplay=true;
    document.body.appendChild(audio);
  }
  audio.srcObject=stream;
}
async function hangupCall(){
  if(activePeer){
    const pc=peerConnections[activePeer];
    if(pc)pc.close();
    delete peerConnections[activePeer];
  }
  if(activeCallId){
    await update(
      ref(
        db,
        `rooms/${roomCode}/calls/${activeCallId}`
      ),
      {
        status:"ended",
        endedAt:Date.now()
      }
    );
  }
  if(localStream){
    localStream.getTracks().forEach(x=>x.stop());
    localStream=null;
  }
  activePeer=null;
  activeCallId=null;
  isMuted=false;
  hideCallOverlay();
  toast("CALL ENDED");
  if(isControl)
    switchTab("calls");
}
function cleanupPeer(uid){
  const pc=peerConnections[uid];
  if(pc)pc.close();
  delete peerConnections[uid];
  if(activePeer===uid){
    activePeer=null;
    activeCallId=null;
    if(localStream){
      localStream.getTracks().forEach(x=>x.stop());
      localStream=null;
    }
    hideCallOverlay();
  }
}
function toggleMute(){
  if(!localStream)return;
  isMuted=!isMuted;
  localStream
    .getAudioTracks()
    .forEach(track=>{
      track.enabled=!isMuted;
    });
  toast(isMuted?"MIC MUTED":"MIC UNMUTED");
  if(isControl)
    renderControl();
}
function showCallOverlay(type,name){
  $("modalRoot").innerHTML=`
    <div class="callOverlay">
      <div class="callModal">

function hideCallOverlay(){
  const modal=$("modalRoot");
  if(modal)
    modal.innerHTML="";
}
let incomingCallData=null;
function acceptIncomingCall(){
  if(!incomingCallData)return;
  const data=incomingCallData;
  incomingCallData=null;
  receiveCall(
    data.callId,
    data.data
  );
}
async function declineIncomingCall(){
  if(!incomingCallData)return;
  const callId=incomingCallData.callId;
  await update(
    ref(db,`rooms/${roomCode}/calls/${callId}`),
    {
      status:"declined",
      endedAt:Date.now()
    }
  );
  incomingCallData=null;
  hideCallOverlay();
}
/* =========================================================

========================================================= */
function subscribeCalls(){
  onValue(
    ref(db,`rooms/${roomCode}/calls`),
    snapshot=>{
      const calls=snapshot.val()||{};
      Object.entries(calls).forEach(([callId,data])=>{
        if(
          !isControl &&
          data.to===user.uid &&
          data.status==="ringing" &&
          !activeCallId &&
          !incomingCallData
        ){
          incomingCallData={
            callId,
            data
          };
          showCallOverlay(
            "INCOMING",
            data.fromName||"COMMAND"
          );
        }
      });
    }
  );
}

async function toggleObjective(index){

  if(!mission)return;
  const state=[
    ...(mission.objectiveState||[])

  state[index]=!state[index];

    ref(db,`rooms/${roomCode}/mission`),
    {

    }
  );

    `${agentName} ${
      state[index]
      ?"completed"
      :"reopened"

  );
}

        ?"MISSION_SUCCESS"
        :"MISSION_FAILURE",
      by:agentName,

    `${agentName} reported mission ${status}`

/* =========================================================
   ROOM LISTENER
========================================================= */
let roomSubscribed=false;
function subscribeRoom(){
  if(roomSubscribed)return;
  roomSubscribed=true;
  onValue(
    roomRef(),
    snapshot=>{
      room=snapshot.val();
      if(!room){
        alert("This HQ no longer exists.");
        location.href="?mode="+
          (isControl?"control":"agent");
        return;
      }
      if(isControl){
        renderControl();
      }else{
        renderAgent();
      }
      processRealtime();
    }
  );
  subscribeCalls();
}
/* =========================================================
   REALTIME COMMAND PROCESSOR
========================================================= */
let lastCommandTime=0;
let lastEffectTime=0;
let lastSoundTime=0;
function processRealtime(){
  const command=room.command;
  if(
    command &&
    command.time &&
    command.time!==lastCommandTime
  ){
    lastCommandTime=command.time;
    if(!isControl)
      handleAgentCommand(command);
  }
  const effect=room.effect;
  if(
    effect &&
    effect.time &&
    effect.time!==lastEffectTime
  ){
    lastEffectTime=effect.time;
    applyEffect(effect.effect);
  }
  const sound=room.sound;
  if(
    sound &&
    sound.time &&
    sound.time!==lastSoundTime
  ){
    lastSoundTime=sound.time;
    playSound(sound.sound);
  }
}
function handleAgentCommand(command){
  if(command.command==="EMERGENCY"){
    showEmergency();
    return;
  }
  toast("HQ: "+command.command);
}
function showEmergency(){
  const modal=$("modalRoot");
  if(!modal)return;

          ACKNOWLEDGE
        </button>
      </div>
    </div>
  `;
}
/* =========================================================
   EFFECTS
========================================================= */
function applyEffect(type){
  if(type==="flash"){
    const x=document.createElement("div");
    x.className="flashEffect";
    document.body.appendChild(x);
    setTimeout(()=>x.remove(),600);
  }
  if(type==="shake"){
    document.body.classList.add("shake");
    setTimeout(()=>{
      document.body.classList.remove("shake");
    },600);
  }
  if(type==="glitch"){
    document.body.classList.add("glitch");
    setTimeout(()=>{
      document.body.classList.remove("glitch");
    },700);
  }
  if(type==="blackout"){
    const x=document.createElement("div");
    x.className="blackoutEffect";
    document.body.appendChild(x);
    setTimeout(()=>x.remove(),1500);
  }
}
/* =========================================================
   SOUND
========================================================= */
let audioContext=null;
function audio(){
  if(!audioContext){
    audioContext=
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();
  }
  if(audioContext.state==="suspended")
    audioContext.resume();
  return audioContext;
}
function beep(freq,duration){
  try{
    const ctx=audio();
    const oscillator=
      ctx.createOscillator();
    const gain=
      ctx.createGain();
    oscillator.frequency.value=freq;
    oscillator.type="sine";
    gain.gain.setValueAtTime(
      .001,
      ctx.currentTime
    );
    gain.gain.exponentialRampToValueAtTime(
      .25,
      ctx.currentTime+.02
    );
    gain.gain.exponentialRampToValueAtTime(
      .001,
      ctx.currentTime+duration
    );
    oscillator.connect(gain);
    gain.connect(ctx.destination);
    oscillator.start();
    oscillator.stop(
      ctx.currentTime+duration+.05
    );
  }catch(e){}
}
function playSound(type){
  if(type==="beep")
    beep(700,.18);
  if(type==="alert"){
    beep(850,.15);
    setTimeout(()=>{
      beep(500,.15);
    },180);
    setTimeout(()=>{
      beep(850,.15);
    },360);
  }
  if(type==="success"){
    beep(500,.12);
    setTimeout(()=>{
      beep(650,.12);
    },130);
    setTimeout(()=>{
      beep(900,.25);
    },260);
  }
  if(type==="warning"){
    beep(950,.2);
    setTimeout(()=>{
      beep(500,.2);
    },240);
    setTimeout(()=>{
      beep(950,.2);
    },480);
  }
}

/* =========================================================
   TIMER
========================================================= */
function remainingTime(mission){
  if(!mission)return "00:00";
  if(!mission.deployedAt)
    return formatSeconds(
      mission.minutes*60
    );
  const elapsed=
    Math.floor(
      (Date.now()-mission.deployedAt)/1000
    );
  const total=
    Number(mission.minutes)*60;
  return formatSeconds(
    Math.max(0,total-elapsed)
  );
}
function formatSeconds(sec){
  sec=Math.max(0,sec);
  const min=
    Math.floor(sec/60)
      .toString()
      .padStart(2,"0");
  const seconds=
    Math.floor(sec%60)
      .toString()
      .padStart(2,"0");
  return `${min}:${seconds}`;
}

  if(room?.mission){
    const timer=$("agentTimer");
    if(timer)
      timer.textContent=
        remainingTime(room.mission);

},1000);

function fullscreen(){
  if(document.documentElement.requestFullscreen){

      .requestFullscreen()
      .catch(()=>{});
  }else if(
    document.documentElement.webkitRequestFullscreen
  ){
    document.documentElement
      .webkitRequestFullscreen();
  }
}

  font-weight:800;
}
.difficulty button.selected{
  background:var(--text);
  color:white;
  border-color:var(--text);
}
.twoCol{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
}
.editorRow{
  display:flex;
  gap:8px;
  margin-bottom:8px;
}
.remove{
  width:45px;
  flex:none;
  border:0;
  border-radius:12px;
  background:var(--soft);
  font-size:20px;
}
.preview{
  margin-top:22px;
  background:#111318;
  color:white;
  border-radius:22px;
  padding:22px;
}
.previewTop{
  display:flex;
  gap:7px;
  margin-bottom:12px;
}
.preview .badge{
  background:rgba(255,255,255,.1);
  color:white;
}
.preview p{
  opacity:.72;
  line-height:1.55;
}
.previewObjectives{
  margin-top:16px;
  display:grid;
  gap:8px;
  opacity:.85;
}
.deployRow{
  display:flex;
  gap:9px;
  margin-top:20px;
}
/* =========================================================
   AGENTS
========================================================= */
.agentGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-bottom:16px;
}
.agentCard{
  background:white;
  border:1px solid var(--line);
  border-radius:20px;
  padding:17px;
  display:flex;
  align-items:center;
  gap:13px;
}
.agentAvatar{
  width:45px;
  height:45px;
  border-radius:14px;
  background:var(--soft);
  display:grid;
  place-items:center;
  font-weight:950;
  flex:none;
}
.agentAvatar.small{
  width:40px;
  height:40px;
}
.agentInfo{
  flex:1;
  min-width:0;
}
.agentInfo h3{
  margin:0 0 4px;
}
.agentActions{
  display:flex;
  gap:6px;
}
.agentActions .button{
  min-height:40px;
  padding:0 11px;
  font-size:11px;
}
.roomControl{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}
/* =========================================================
   CALLS
========================================================= */
.callAgentGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}
.callAgent{
  display:flex;
  align-items:center;
  gap:10px;
  border:1px solid var(--line);
  background:white;
  border-radius:16px;
  padding:12px;
  text-align:left;
}
.callAgent span{
  display:block;
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
}
.callControls{
  display:flex;
  gap:8px;
}
.callOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(15px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:1000;
}
.callModal{
  width:min(420px,100%);
  background:white;
  border-radius:30px;
  padding:30px;
  text-align:center;
  box-shadow:
    0 30px 90px rgba(0,0,0,.3);
}
.callIcon{
  width:65px;
  height:65px;
  margin:0 auto 20px;
  border-radius:20px;
  background:#e9f8f1;
  color:var(--green);
  display:grid;
  place-items:center;
  font-size:28px;
  animation:ring 1.4s infinite;
}
@keyframes ring{
  50%{
    transform:scale(1.08);
  }
}
.callButtons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:20px;
}
/* =========================================================
   CHAT
========================================================= */
.chatBox{
  height:470px;
  display:flex;
  flex-direction:column;
}
.messages{
  flex:1;
  overflow:auto;
  padding:5px;
}
.message{
  margin-bottom:11px;
}
.message.mine{
  text-align:right;
}
.messageName{
  font-size:10px;
  color:var(--muted);
  font-weight:800;
  margin-bottom:3px;
}
.bubble{
  display:inline-block;
  max-width:82%;
  padding:10px 13px;
  border-radius:14px;
  background:var(--soft);
  font-size:14px;
  line-height:1.4;
}
.mine .bubble{
  background:var(--accent);
  color:white;
}
.chatComposer{
  display:flex;
  gap:8px;
  padding-top:10px;
}
/* =========================================================
   COMMAND
========================================================= */
.commandGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}
.commandButton{
  min-height:105px;
  border:1px solid var(--line);
  border-radius:18px;
  background:white;
  text-align:left;
  padding:16px;
}
.commandButton b{
  display:block;
  margin-bottom:6px;
}
.commandButton span{
  font-size:11px;
  color:var(--muted);
}
.commandButton.green{
  background:#e9f8f1;
  color:#087847;
}
.commandButton.red{
  background:#fff0f0;
  color:#a3292e;
}
.commandButton.orange{
  background:#fff5e7;
  color:#9a6212;
}
.commandHeading{
  margin:25px 0 12px;
}
.signalGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}
.signalGrid button{
  min-height:46px;
  border:1px solid var(--line);
  background:white;
  border-radius:13px;
  font-weight:800;
}
.missionTimer{
  font-size:50px;
  font-weight:950;
  letter-spacing:-2px;
  margin-top:18px;
}
.dangerCard{
  border-color:#ffd4d4;
  background:#fffafa;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}
/* =========================================================
   ACTIVITY
========================================================= */
.activityItem{
  display:flex;
  gap:18px;
  padding:14px 0;
  border-bottom:1px solid var(--line);
  font-size:13px;
}
.activityTime{
  width:80px;
  color:var(--muted);
  font-size:11px;
  flex:none;
}
/* =========================================================
   AGENT MISSION
========================================================= */
.missionHero{
  background:#111318;
  color:white;
  border-radius:28px;
  padding:27px;
  margin-bottom:16px;
}
.heroTop{
  display:flex;
  gap:7px;
}
.missionHero .badge{
  background:rgba(255,255,255,.1);
  color:white;
}
.missionHero h1{
  font-size:38px;
  letter-spacing:-1.5px;
  margin:17px 0 8px;
}
.missionHero p{
  color:rgba(255,255,255,.7);
  line-height:1.6;
  max-width:750px;
}
.bigTimer{
  font-size:62px;
  font-weight:950;
  letter-spacing:-3px;
  margin-top:20px;
  font-variant-numeric:tabular-nums;
}
.timerLabel{
  font-size:10px;
  font-weight:900;
  letter-spacing:1.4px;
  opacity:.5;
}
.agentObjectives{
  display:grid;
  gap:8px;
}
.agentObjective{
  display:flex;
  align-items:center;
  gap:14px;
  width:100%;
  border:1px solid var(--line);
  background:white;
  border-radius:17px;
  padding:15px;
  text-align:left;
}
.agentObjective.done{
  background:#e9f8f1;
  border-color:#bce8d2;
}
.objectiveCheck{
  width:35px;
  height:35px;
  border-radius:12px;
  background:var(--soft);
  display:grid;
  place-items:center;
  font-weight:950;
  flex:none;
}
.done .objectiveCheck{
  background:var(--green);
  color:white;
}
.agentObjective b{
  display:block;
}
.agentObjective span{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-top:4px;
}
.missionActions{
  display:flex;
  gap:9px;
  margin-top:18px;
}
.clue{
  padding:14px;
  background:#fff8e8;
  border:1px solid #f1ddb2;
  border-radius:15px;
  margin-bottom:9px;
  line-height:1.5;
}
.clue b{
  display:block;
  color:#956415;
  font-size:10px;
  letter-spacing:.7px;
  margin-bottom:5px;
}
.waitingCard{
  text-align:center;
  width:min(500px,100%);
}
.waitingIcon{
  font-size:50px;
  margin-bottom:15px;
}
/* =========================================================
   EMERGENCY
========================================================= */
.emergencyOverlay{
  position:fixed;
  inset:0;
  z-index:5000;
  background:rgba(80,0,0,.93);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  animation:emergencyPulse 1s infinite;
}
@keyframes emergencyPulse{
  50%{
    background:rgba(50,0,0,.95);
  }
}
.emergencyBox{
  width:min(500px,100%);
  text-align:center;
  color:white;
}
.emergencyIcon{
  width:80px;
  height:80px;
  border:4px solid white;
  border-radius:50%;
  display:grid;
  place-items:center;
  margin:0 auto 25px;
  font-size:42px;
  font-weight:950;
}
.emergencyBox h1{
  font-size:58px;
  margin:10px 0;
  letter-spacing:-2px;
}
.emergencyBox p{
  opacity:.75;
  line-height:1.6;
}
/* =========================================================
   EFFECTS
========================================================= */
.flashEffect{
  position:fixed;
  inset:0;
  background:white;
  z-index:9000;
  pointer-events:none;
  animation:flash .55s;
}
@keyframes flash{
  0%,100%{
    opacity:0;
  }
  25%{
    opacity:1;
  }
}
.blackoutEffect{
  position:fixed;
  inset:0;
  background:#000;
  z-index:9000;
  pointer-events:none;
  animation:blackout 1.5s;
}
@keyframes blackout{
  0%,100%{
    opacity:0;
  }
  15%,85%{
    opacity:1;
  }
}
.shake{
  animation:shake .55s;
}
@keyframes shake{
  20%{
    transform:translateX(-9px);
  }
  40%{
    transform:translateX(9px);
  }
  60%{
    transform:translateX(-7px);
  }
  80%{
    transform:translateX(7px);
  }
}
.glitch{
  animation:glitch .65s;
}
@keyframes glitch{
  20%{
    transform:skewX(7deg);
  }
  40%{
    transform:skewX(-7deg);
  }
  60%{
    transform:translateX(8px);
  }
  80%{
    transform:translateX(-8px);
  }
}
/* =========================================================
   TOAST
========================================================= */
.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translateX(-50%);
  background:#111318;
  color:white;
  padding:13px 17px;
  border-radius:14px;
  font-size:13px;
  font-weight:800;
  z-index:8000;
  box-shadow:
    0 15px 40px rgba(0,0,0,.2);
}
.fatal{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.fatalCard{
  max-width:500px;
  background:white;
  border:1px solid var(--line);
  border-radius:25px;
  padding:28px;
  box-shadow:var(--shadow);
}
.fatalIcon{
  width:50px;
  height:50px;
  border-radius:15px;
  background:#fff0f0;
  color:var(--red);
  display:grid;
  place-items:center;
  font-size:25px;
  font-weight:950;
}
/* =========================================================
   RESPONSIVE
========================================================= */
@media(max-width:950px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }
  .presetGrid{
    grid-template-columns:repeat(2,1fr);
  }
  .grid>.card,
  .grid>.large{
    grid-column:span 12;
  }
  .commandGrid{
    grid-template-columns:repeat(2,1fr);
  }
  .signalGrid{
    grid-template-columns:repeat(2,1fr);
  }
}
@media(max-width:650px){
  .topbar{
    padding:0 13px;
  }
  .brand span{
    display:none;
  }
  .main{
    padding:15px;
  }
  .dashboardHeader{
    align-items:flex-start;
    flex-direction:column;
  }
  .dashboardHeader h1{
    font-size:30px;
  }
  .stats{
    grid-template-columns:1fr 1fr;
  }
  .presetGrid,
  .agentGrid,
  .callAgentGrid{
    grid-template-columns:1fr;
  }
  .typeGrid{
    grid-template-columns:1fr 1fr;
  }
  .difficulty{
    grid-template-columns:1fr 1fr;
  }
  .twoCol{
    grid-template-columns:1fr;
  }
  .commandGrid{
    grid-template-columns:1fr 1fr;
  }
  .signalGrid{
    grid-template-columns:1fr 1fr;
  }
  .missionActions{
    flex-direction:column;
  }
  .dangerCard{
    flex-direction:column;
    align-items:stretch;
  }
  .missionHero h1{
    font-size:30px;
  }
  .bigTimer{
    font-size:48px;
  }
  .hugeCode{
    font-size:34px;
  }
  .landing{
    padding:27px;
  }
  .landing h1{
    font-size:32px;
  }
  .roomPill{
    font-size:12px;
  }
  .agentActions{
    flex-direction:column;
  }
}
</style>
