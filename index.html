<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fa">
<title>COMMAND // Mission Network</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#f4f6f8;
  --surface:#ffffff;
  --surface2:#eef1f4;
  --text:#111820;
  --muted:#697583;
  --line:#dce2e8;
  --black:#111820;
  --blue:#1769ff;
  --green:#13a05b;
  --red:#e5484d;
  --orange:#ed8b00;
  --purple:#7957d5;
  --shadow:0 12px 35px rgba(20,32,45,.08);
  --radius:18px;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}

body{
  overflow-x:hidden;
}

button,input,textarea{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

.app{
  min-height:100vh;
}

.hidden{
  display:none!important;
}

/* ---------- TOP ---------- */

.top{
  height:72px;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  position:sticky;
  top:0;
  z-index:100;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  font-weight:900;
  letter-spacing:-.5px;
}

.brandMark{
  width:38px;
  height:38px;
  background:var(--black);
  color:white;
  border-radius:11px;
  display:grid;
  place-items:center;
  font-weight:1000;
}

.connection{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:12px;
  font-weight:700;
  color:var(--muted);
}

.connectionDot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#b5bdc7;
}

.connectionDot.online{
  background:var(--green);
}

/* ---------- GENERAL ---------- */

.wrap{
  width:min(1240px,100%);
  margin:auto;
  padding:24px;
}

.hero{
  min-height:calc(100vh - 72px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px 20px;
}

.heroInner{
  width:min(850px,100%);
  text-align:center;
}

.eyebrow{
  display:inline-flex;
  background:#e8edf2;
  border-radius:999px;
  padding:8px 12px;
  font-size:11px;
  font-weight:900;
  letter-spacing:1.3px;
  color:#4e5a67;
}

.hero h1{
  font-size:clamp(54px,11vw,110px);
  line-height:.88;
  letter-spacing:-7px;
  margin:25px 0 18px;
}

.hero p{
  max-width:670px;
  margin:0 auto;
  color:var(--muted);
  font-size:17px;
  line-height:1.6;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin-top:28px;
}

.btn{
  border:1px solid var(--line);
  background:white;
  color:var(--text);
  min-height:46px;
  padding:0 17px;
  border-radius:12px;
  font-weight:850;
  transition:.15s;
  box-shadow:0 2px 5px rgba(0,0,0,.03);
}

.btn:active{
  transform:scale(.97);
}

.btn.primary{
  background:var(--black);
  color:white;
  border-color:var(--black);
}

.btn.blue{
  background:var(--blue);
  color:white;
  border-color:var(--blue);
}

.btn.green{
  background:var(--green);
  color:white;
  border-color:var(--green);
}

.btn.red{
  background:var(--red);
  color:white;
  border-color:var(--red);
}

.btn.orange{
  background:var(--orange);
  color:white;
  border-color:var(--orange);
}

.btn.purple{
  background:var(--purple);
  color:white;
  border-color:var(--purple);
}

.btn.small{
  min-height:36px;
  padding:0 11px;
  font-size:12px;
}

.grid{
  display:grid;
  gap:16px;
}

.two{
  grid-template-columns:1fr 1fr;
}

.three{
  grid-template-columns:repeat(3,1fr);
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px;
}

.cardHeader{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  margin-bottom:18px;
}

.cardHeader h2{
  margin:0;
  font-size:19px;
}

.cardHeader p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:13px;
}

.badge{
  display:inline-flex;
  align-items:center;
  border-radius:999px;
  background:var(--surface2);
  padding:6px 9px;
  font-size:10px;
  font-weight:900;
  white-space:nowrap;
}

.field{
  margin-bottom:17px;
}

.field label{
  display:block;
  margin-bottom:7px;
  color:#5e6975;
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.8px;
}

input,textarea{
  width:100%;
  border:1px solid var(--line);
  background:#fbfcfd;
  border-radius:11px;
  padding:13px;
  outline:none;
  color:var(--text);
}

input:focus,textarea:focus{
  border-color:#9ab6f7;
  box-shadow:0 0 0 3px rgba(23,105,255,.08);
}

textarea{
  min-height:120px;
  resize:vertical;
}

/* ---------- ROOM ---------- */

.roomCode{
  background:var(--black);
  color:white;
  border-radius:17px;
  padding:24px;
  text-align:center;
}

.roomCode small{
  display:block;
  opacity:.55;
  font-size:10px;
  font-weight:900;
  letter-spacing:2px;
}

.roomCode strong{
  display:block;
  font-size:48px;
  letter-spacing:8px;
  margin-top:6px;
}

/* ---------- TABS ---------- */

.tabs{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:3px 1px 15px;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  flex:0 0 auto;
  border:1px solid var(--line);
  background:white;
  color:#64707c;
  border-radius:10px;
  min-height:40px;
  padding:0 13px;
  font-size:12px;
  font-weight:900;
}

.tab.active{
  background:var(--black);
  color:white;
  border-color:var(--black);
}

/* ---------- STATS ---------- */

.stat{
  padding:5px;
}

.statNumber{
  font-size:31px;
  font-weight:1000;
  letter-spacing:-1px;
}

.statLabel{
  color:var(--muted);
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.7px;
}

/* ---------- MISSION TYPES ---------- */

.types{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.type{
  min-height:125px;
  border:1px solid var(--line);
  border-radius:15px;
  background:#fafbfc;
  text-align:left;
  padding:14px;
  color:var(--text);
}

.type.selected{
  border:2px solid var(--black);
  background:#f1f3f5;
}

.typeIcon{
  font-size:30px;
}

.typeName{
  font-weight:1000;
  margin-top:9px;
}

.typeDesc{
  color:var(--muted);
  font-size:11px;
  line-height:1.35;
  margin-top:4px;
}

/* ---------- CHOICES ---------- */

.choices{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}

.choice{
  border:1px solid var(--line);
  background:white;
  color:#687482;
  border-radius:9px;
  padding:9px 12px;
  font-size:12px;
  font-weight:900;
}

.choice.selected{
  background:var(--black);
  color:white;
  border-color:var(--black);
}

/* ---------- OBJECTIVES ---------- */

.objective{
  display:grid;
  grid-template-columns:24px 1fr 38px;
  gap:8px;
  align-items:center;
  margin-bottom:8px;
}

.objectiveNumber{
  width:24px;
  height:24px;
  display:grid;
  place-items:center;
  border-radius:7px;
  background:#edf0f3;
  font-size:10px;
  font-weight:1000;
}

.remove{
  width:38px;
  height:44px;
  border:1px solid #f1c4c6;
  background:#fff7f7;
  color:var(--red);
  border-radius:10px;
  font-weight:1000;
}

/* ---------- PREVIEW ---------- */

.preview{
  position:sticky;
  top:94px;
  overflow:hidden;
  padding:0;
}

.previewTop{
  background:var(--black);
  color:white;
  padding:25px;
}

.previewTop .small{
  opacity:.55;
  font-size:10px;
  font-weight:900;
  letter-spacing:2px;
}

.previewTop h2{
  font-size:32px;
  line-height:1;
  letter-spacing:-1px;
  margin:10px 0 0;
}

.previewBody{
  padding:20px;
}

.previewBriefing{
  color:#5e6975;
  line-height:1.55;
  font-size:14px;
}

.previewObjective{
  padding:12px;
  border:1px solid var(--line);
  border-radius:11px;
  margin-top:8px;
  background:#fafbfc;
  font-size:13px;
}

.previewRule{
  margin-top:15px;
  padding:12px;
  background:#f3f5f7;
  border-radius:11px;
  font-size:12px;
}

/* ---------- DEPLOY BAR ---------- */

.deploy{
  position:sticky;
  bottom:14px;
  z-index:30;
  margin-top:16px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(18px);
  border-radius:17px;
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  box-shadow:0 15px 45px rgba(0,0,0,.12);
}

.deployText strong{
  display:block;
  font-size:13px;
}

.deployText span{
  color:var(--muted);
  font-size:11px;
}

/* ---------- CHAT ---------- */

.chatBox{
  height:480px;
  display:flex;
  flex-direction:column;
}

.messages{
  flex:1;
  overflow:auto;
  padding-right:3px;
}

.message{
  max-width:82%;
  margin-bottom:9px;
  padding:10px 12px;
  border-radius:13px;
  background:#f0f2f4;
}

.message.mine{
  margin-left:auto;
  background:var(--black);
  color:white;
}

.messageName{
  font-size:10px;
  font-weight:900;
  opacity:.6;
  margin-bottom:3px;
}

.messageText{
  font-size:13px;
  line-height:1.4;
}

.chatSend{
  display:flex;
  gap:8px;
  margin-top:10px;
}

.chatSend input{
  flex:1;
}

/* ---------- AGENTS ---------- */

.agentRow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  border-bottom:1px solid var(--line);
  padding:13px 0;
}

.agentRow:last-child{
  border-bottom:0;
}

.agentLeft{
  display:flex;
  align-items:center;
  gap:11px;
}

.avatar{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  background:#edf0f3;
  border-radius:12px;
  font-weight:1000;
}

.agentName{
  font-weight:900;
}

.agentMeta{
  color:var(--muted);
  font-size:10px;
  margin-top:2px;
}

/* ---------- AGENT MISSION ---------- */

.agentPage{
  width:min(900px,100%);
  margin:auto;
}

.agentHero{
  background:var(--black);
  color:white;
  border-radius:24px;
  padding:30px;
  text-align:center;
}

.agentHeroIcon{
  font-size:62px;
}

.agentType{
  opacity:.55;
  font-size:10px;
  letter-spacing:2px;
  font-weight:900;
}

.agentHero h1{
  font-size:clamp(38px,9vw,75px);
  line-height:.92;
  letter-spacing:-4px;
  margin:12px 0;
}

.agentBriefing{
  max-width:650px;
  margin:auto;
  color:#bdc5ce;
  line-height:1.6;
  font-size:14px;
}

.timerCard{
  text-align:center;
}

.timer{
  font-size:clamp(60px,14vw,120px);
  line-height:1;
  font-weight:1000;
  letter-spacing:-5px;
}

.timer.warning{
  color:var(--orange);
}

.timer.danger{
  color:var(--red);
}

.objectiveAgent{
  display:flex;
  align-items:flex-start;
  gap:12px;
  padding:14px;
  border:1px solid var(--line);
  border-radius:13px;
  margin-top:8px;
}

.objectiveAgent input{
  width:20px;
  height:20px;
  margin-top:1px;
}

.progressOuter{
  height:9px;
  background:#e9edf0;
  border-radius:999px;
  overflow:hidden;
}

.progressInner{
  height:100%;
  background:var(--green);
  width:0%;
  transition:.25s;
}

/* ---------- CALL ---------- */

.call{
  position:fixed;
  inset:0;
  z-index:1000;
  background:rgba(13,19,25,.7);
  backdrop-filter:blur(12px);
  display:grid;
  place-items:center;
  padding:20px;
}

.callCard{
  width:min(390px,100%);
  background:white;
  border-radius:26px;
  padding:28px;
  text-align:center;
  box-shadow:0 30px 100px rgba(0,0,0,.25);
}

.callAvatar{
  width:84px;
  height:84px;
  margin:auto;
  border-radius:50%;
  background:var(--black);
  color:white;
  display:grid;
  place-items:center;
  font-size:34px;
  animation:ring 1.3s infinite;
}

@keyframes ring{
  50%{
    box-shadow:0 0 0 15px rgba(23,105,255,.08),
               0 0 0 30px rgba(23,105,255,.04)
  }
}

/* ---------- MODAL ---------- */

.modal{
  position:fixed;
  inset:0;
  z-index:800;
  background:rgba(13,19,25,.65);
  backdrop-filter:blur(10px);
  display:grid;
  place-items:center;
  padding:18px;
}

.modalCard{
  width:min(600px,100%);
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:22px;
  padding:22px;
}

/* ---------- ERROR ---------- */

.errorScreen{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:25px;
}

.errorCard{
  width:min(650px,100%);
  background:white;
  border:1px solid #f0c9ca;
  border-radius:20px;
  padding:25px;
  box-shadow:var(--shadow);
}

.errorTitle{
  color:var(--red);
  font-size:25px;
  font-weight:1000;
}

.errorText{
  margin-top:12px;
  color:#5c6874;
  white-space:pre-wrap;
  line-height:1.5;
  font-family:monospace;
  font-size:12px;
}

/* ---------- TOAST ---------- */

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  z-index:2000;
  background:var(--black);
  color:white;
  padding:11px 16px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
  box-shadow:0 12px 40px rgba(0,0,0,.2);
}

/* ---------- RESPONSIVE ---------- */

@media(max-width:850px){
  .two,.three{
    grid-template-columns:1fr;
  }

  .preview{
    position:static;
  }
}

@media(max-width:600px){
  .wrap{
    padding:14px;
  }

  .top{
    padding:0 13px;
  }

  .brand span{
    display:none;
  }

  .types{
    grid-template-columns:1fr 1fr;
  }

  .type{
    min-height:110px;
  }

  .deploy{
    flex-direction:column;
    align-items:stretch;
  }

  .deploy .btn{
    width:100%;
  }

  .hero h1{
    letter-spacing:-4px;
  }
}
</style>
</head>

<body>

<div id="root"></div>

<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.1.0/firebase-database-compat.js"></script>

<script>

/* =========================================================
   FIREBASE
   ========================================================= */

const firebaseConfig = {
  apiKey: "YOUR_API_KEY_HERE",
  authDomain: "web-walkie-talkie-eb91f.firebaseapp.com",
  databaseURL: "https://web-walkie-talkie-eb91f-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "web-walkie-talkie-eb91f",
  storageBucket: "web-walkie-talkie-eb91f.firebasestorage.app",
  messagingSenderId: "174542114980",
  appId: "1:174542114980:web:f4a48ec7fe322030bdd631"
};


/* =========================================================
   GLOBAL STATE
   ========================================================= */

let db=null;
let auth=null;
let currentUser=null;

let roomCode=null;
let roomData=null;
let role=null;
let agentName=null;

let roomListener=null;
let timerInterval=null;
let lastDJTime=0;
let lastCallTime=0;
let lastEffectTime=0;

let builder={
  type:"recon",
  difficulty:"standard",
  title:"Operation Blackout",
  briefing:"",
  objectives:[],
  clues:[],
  countdown:300,
  success:"All objectives completed",
  failure:"Time expires"
};

const TYPES={
  recon:{
    icon:"🛰️",
    name:"RECON",
    desc:"Observe, locate and report."
  },
  extraction:{
    icon:"🚨",
    name:"EXTRACTION",
    desc:"Reach the target and extract."
  },
  investigation:{
    icon:"🔎",
    name:"INVESTIGATION",
    desc:"Follow evidence and solve."
  },
  escort:{
    icon:"🛡️",
    name:"ESCORT",
    desc:"Protect the assigned target."
  },
  survival:{
    icon:"⏳",
    name:"SURVIVAL",
    desc:"Stay operational until time ends."
  },
  covert:{
    icon:"🕶️",
    name:"COVERT",
    desc:"Complete the operation unseen."
  }
};


/* =========================================================
   HELPERS
   ========================================================= */

function $(id){
  return document.getElementById(id);
}

function esc(value){
  return String(value??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function randomCode(){

  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let result="";

  for(let i=0;i<5;i++){
    result+=chars[
      Math.floor(Math.random()*chars.length)
    ];
  }

  return result;
}

function formatTime(seconds){

  seconds=Math.max(0,Math.floor(seconds));

  const min=Math.floor(seconds/60);
  const sec=seconds%60;

  return String(min).padStart(2,"0")
       +":"
       +String(sec).padStart(2,"0");
}

function toast(text){

  const old=document.querySelector(".toast");

  if(old)old.remove();

  const el=document.createElement("div");

  el.className="toast";
  el.textContent=text;

  document.body.appendChild(el);

  setTimeout(()=>{
    el.remove();
  },2600);
}

function setConnection(online){

  const dot=document.querySelector(".connectionDot");

  if(dot){
    dot.classList.toggle("online",online);
  }
}

function showError(title,message){

  document.body.innerHTML=`

    <div class="errorScreen">

      <div class="errorCard">

        <div class="errorTitle">
          ${esc(title)}
        </div>

        <div class="errorText">
          ${esc(message)}
        </div>

        <div style="margin-top:20px">

          <button
            class="btn primary"
            onclick="location.reload()">
            RELOAD
          </button>

        </div>

      </div>

    </div>
  `;
}


/* =========================================================
   FIREBASE INITIALIZATION
   ========================================================= */

function initFirebase(){

  try{

    if(
      !firebaseConfig.apiKey ||
      firebaseConfig.apiKey==="AIzaSyAwziMLKnyFi8of5AbS3NXOmVQwo1Ngn5M"
    ){
      throw new Error(
        "Firebase API key is missing. Paste your Firebase Web App apiKey into firebaseConfig."
      );
    }

    if(!firebase.apps.length){
      firebase.initializeApp(firebaseConfig);
    }

    auth=firebase.auth();
    db=firebase.database();

    return true;

  }catch(error){

    showError(
      "Firebase could not start",
      error.message
    );

    return false;
  }
}


/* =========================================================
   LANDING
   ========================================================= */

function landing(){

  document.body.innerHTML=`

    <div class="app">

      <header class="top">

        <div class="brand">

          <div class="brandMark">
            C
          </div>

          <span>
            COMMAND
          </span>

        </div>

        <div class="connection">
          <span class="connectionDot online"></span>
          READY
        </div>

      </header>

      <main class="hero">

        <div class="heroInner">

          <div class="eyebrow">
            LIVE MISSION NETWORK
          </div>

          <h1>
            YOUR<br>
            HQ.
          </h1>

          <p>
            Create operations. Recruit agents.
            Deploy missions. Communicate live.
            Everything happens in one clean command center.
          </p>

          <div class="actions">

            <button class="btn primary"
                    id="createBtn">
              CREATE HQ
            </button>

            <button class="btn"
                    id="joinBtn">

/* =========================================================
   CREATE HQ
   ========================================================= */

async function createHQ(){

  try{

    if(!currentUser){

      await auth.signInAnonymously();

      currentUser=auth.currentUser;
    }

    let code=randomCode();

    let existing=
      await db.ref("rooms/"+code).once("value");

    while(existing.exists()){

      code=randomCode();

      existing=
        await db.ref("rooms/"+code).once("value");
    }

    roomCode=code;
    role="control";

    await db.ref("rooms/"+code).set({

      createdAt:Date.now(),

      creator:currentUser.uid,

      status:"LOBBY",

      mission:null,

      players:{},

      chat:{},

      command:null,

      dj:null,

      call:null,

      effect:null

    });

    control();

  }catch(error){

    showError(
      "Could not create HQ",
      error.code+"\n\n"+error.message
    );
  }
}

async function confirmJoin(){

  const code=
    $("joinCode").value.trim().toUpperCase();

  const name=
    $("joinName").value.trim()||"Agent";

  if(code.length!==5){

    toast("Enter a 5-character code.");

    return;
  }

  try{

    const snap=
      await db.ref("rooms/"+code).once("value");

    if(!snap.exists()){

      toast("HQ not found.");

      return;
    }

    if(!currentUser){

      await auth.signInAnonymously();

      currentUser=auth.currentUser;
    }

    roomCode=code;
    role="agent";
    agentName=name;

    await db.ref(
      "rooms/"+code+
      "/players/"+currentUser.uid
    ).set({

      name:name,

      joinedAt:Date.now(),

      status:"READY"

    });

    closeModal();

    agent();

  }catch(error){

    showError(
      "Could not join HQ",
      error.code+"\n\n"+error.message

/* =========================================================
   ROOM LISTENER
   ========================================================= */

function listenRoom(){

  if(roomListener)roomListener.off();

  roomListener=
    db.ref("rooms/"+roomCode);

  roomListener.on("value",snap=>{

    if(!snap.exists()){

      showError(
        "HQ closed",
        "This command room no longer exists."
      );

      return;
    }

    const old=roomData;

    roomData=snap.val();

    setConnection(true);

    const players=
      Object.keys(roomData.players||{}).length;

    const count=$("agentCount");

    if(count)count.textContent=players;

    const status=$("missionStatus");

    if(status){

      status.textContent=
        roomData.status||"LOBBY";
    }

    if(
      old &&
      roomData.chat!==old.chat &&
      document.querySelector("#messages")
    ){
      renderMessages();
    }

    if(
      old &&
      roomData.mission &&
      old.mission?.id!==roomData.mission?.id
    ){
      toast("Mission deployed.");
    }

  },error=>{

    showError(
      "Realtime Database error",
      error.message
    );

  });
}

async function deployMission(){

  const objectives=
    builder.objectives
      .filter(x=>x.text.trim());

  if(!builder.title.trim()){

    toast("Give the mission a name.");

    return;
  }

  if(!builder.briefing.trim()){

    toast("Write a briefing.");

    return;
  }

  if(!objectives.length){

    toast("Add at least one objective.");

    return;
  }

  const mission={

    id:
      Date.now().toString(36)+
      Math.random().toString(36).slice(2,7),

    type:builder.type,

    difficulty:builder.difficulty,

    title:builder.title.trim(),

    briefing:builder.briefing.trim(),

    objectives,

    clues:
      builder.clues.filter(x=>x.trim()),

    countdown:builder.countdown,

    success:builder.success,

    failure:builder.failure,

    deployedAt:Date.now(),

    status:"ACTIVE",

    objectiveState:
      objectives.map(()=>false)

  };

  try{

    await db.ref(
      "rooms/"+roomCode
    ).update({

      mission,

      status:"ACTIVE",

      command:{
        text:"MISSION DEPLOYED",
        at:Date.now()
      }

    });

    await activity(
      "Mission deployed: "+mission.title
    );

    toast("MISSION DEPLOYED");

  }catch(error){

    toast(
      "Deploy failed: "+error.message
    );
  }
}

/* =========================================================

   ========================================================= */

function listenAgent(){

  if(roomListener)roomListener.off();

  roomListener=
    db.ref("rooms/"+roomCode);

  roomListener.on("value",snap=>{

    if(!snap.exists())return;

    const old=roomData;

    roomData=snap.val();

    setConnection(true);

    if(
      old &&
      roomData.dj?.at &&
      roomData.dj.at!==lastDJTime
    ){

      lastDJTime=
        roomData.dj.at;

      playSound(
        roomData.dj.sound
      );
    }


    if(
      old &&
      roomData.call?.at &&
      roomData.call.at!==lastCallTime
    ){

      lastCallTime=
        roomData.call.at;

      showIncomingCall(
        roomData.call
      );
    }


    if(
      old &&
      roomData.effect?.at &&
      roomData.effect.at!==lastEffectTime
    ){

      lastEffectTime=
        roomData.effect.at;

      playEffect(
        roomData.effect.type
      );
    }

    renderAgent();

  });
}

/* =========================================================
   AGENT TIMER
   ========================================================= */

let timerMissionId=null;

function startAgentTimer(mission){

  if(timerMissionId===mission.id)
    return;

  timerMissionId=mission.id;

  clearInterval(timerInterval);

  const end=
    mission.deployedAt+
    mission.countdown*1000;

  function tick(){

    const el=$("agentTimer");

    if(!el)return;

    const remaining=
      Math.max(
        0,
        Math.ceil(
          (end-Date.now())/1000
        )
      );

    el.textContent=
      formatTime(remaining);

    el.classList.remove(
      "warning",
      "danger"
    );

    if(remaining<=60)
      el.classList.add("danger");
    else if(remaining<=120)
      el.classList.add("warning");

    if(remaining<=0){

      clearInterval(timerInterval);

      if(
        roomData?.mission?.status==="ACTIVE"
      ){

        db.ref(
          "rooms/"+roomCode+
          "/mission/status"
        ).set("FAILED");

      }

    }

  }

  tick();

  timerInterval=
    setInterval(tick,1000);
}


/* =========================================================
   AUDIO
   ========================================================= */

let audioContext=null;

function unlockAudio(){

  try{

    if(!audioContext){

      audioContext=
        new (
          window.AudioContext||
          window.webkitAudioContext
        )();

    }

    audioContext.resume();

  }catch(error){

    console.log(error);

  }
}

function playSound(type){

  unlockAudio();

  if(!audioContext)return;

  const ctx=audioContext;

  const osc=
    ctx.createOscillator();

  const gain=
    ctx.createGain();

  osc.connect(gain);
  gain.connect(ctx.destination);

  const t=ctx.currentTime;

  if(type==="ping"){

    osc.frequency.setValueAtTime(
      700,t
    );

    osc.frequency.exponentialRampToValueAtTime(
      1100,t+.15
    );

  }

  if(type==="alert"){

    osc.frequency.setValueAtTime(
      880,t
    );

    osc.frequency.setValueAtTime(
      440,t+.18
    );

  }

  if(type==="siren"){

    osc.frequency.setValueAtTime(
      400,t
    );

    osc.frequency.exponentialRampToValueAtTime(
      1000,t+.35
    );

    osc.frequency.exponentialRampToValueAtTime(
      350,t+.7
    );

  }

  if(type==="bass"){

    osc.frequency.setValueAtTime(
      100,t
    );

    osc.frequency.exponentialRampToValueAtTime(
      45,t+.4
    );

  }

  gain.gain.setValueAtTime(
    .0001,t
  );

  gain.gain.exponentialRampToValueAtTime(
    .22,t+.02
  );

  gain.gain.exponentialRampToValueAtTime(
    .0001,t+.8
  );

  osc.start(t);
  osc.stop(t+.85);
}


/* =========================================================
   VISUAL EFFECTS
   ========================================================= */

function playEffect(type){

  if(type==="flash"){

    const el=document.createElement("div");

    el.style.position="fixed";
    el.style.inset="0";
    el.style.background="white";
    el.style.zIndex="3000";
    el.style.pointerEvents="none";

    document.body.appendChild(el);

    setTimeout(()=>{
      el.remove();
    },180);

  }


  if(type==="shake"){

    document.body.animate(
      [
        {transform:"translateX(0)"},
        {transform:"translateX(8px)"},
        {transform:"translateX(-8px)"},
        {transform:"translateX(5px)"},
        {transform:"translateX(0)"}
      ],
      {
        duration:400
      }
    );

  }


  if(type==="glitch"){

    document.body.animate(
      [
        {filter:"none"},
        {filter:"contrast(2)"},
        {filter:"hue-rotate(90deg)"},
        {filter:"none"}
      ],
      {
        duration:600
      }
    );

  }
}

/* =========================================================
   STARTUP
   ========================================================= */

async function start(){

  if(!initFirebase())
    return;

  try{

    await auth.signInAnonymously();

    currentUser=
      auth.currentUser;

    setConnection(true);

    landing();

  }catch(error){

    showError(
      "Firebase authentication failed",
      error.code+
      "\n\n"+
      error.message+
      "\n\n"+
      "Make sure Anonymous Authentication is enabled in Firebase."
    );
  }
}

start();
