<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>iPhone Simulator</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif;
  background:#111;
  color:white;
}

button,input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

#stage{
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at 50% 35%,#273044 0,#111 38%,#050505 75%);
  overflow:hidden;
}

/* PHONE */

.phone{
  width:min(390px,92vw);
  height:min(844px,94vh);
  position:relative;
  border-radius:52px;
  background:#050505;
  padding:8px;
  box-shadow:
    0 50px 100px rgba(0,0,0,.65),
    0 0 0 2px #444,
    inset 0 0 0 2px #111;
  transition:
    transform .5s cubic-bezier(.2,.8,.2,1),
    opacity .5s;
  z-index:10;
}

.phone.hidden{
  opacity:0;
  transform:scale(.8) translateY(100px);
  pointer-events:none;
}

.phone-screen{
  width:100%;
  height:100%;
  overflow:hidden;
  position:relative;
  border-radius:45px;
  background:#111;
}

/* DYNAMIC ISLAND */

.dynamic-island{
  position:absolute;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  width:120px;
  height:34px;
  border-radius:22px;
  background:#000;
  z-index:9999;
  transition:.35s;
}

.dynamic-island.active{
  width:210px;
}

/* SIDE BUTTONS */

.side{
  position:absolute;
  background:#333;
  right:-4px;
  width:4px;
  border-radius:3px;
}

.power{
  top:170px;
  height:100px;
}

.volume{
  left:-4px;
  right:auto;
  width:4px;
  top:160px;
  height:65px;
}

.volume2{
  left:-4px;
  right:auto;
  width:4px;
  top:235px;
  height:65px;
}

/* UNBOXING */

#unboxing{
  position:fixed;
  inset:0;
  z-index:50000;
  background:
    radial-gradient(circle at 50% 25%,#fff 0,#d7d7d7 20%,#777 55%,#111 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  transition:opacity 1s;
}

#unboxing.hide{
  opacity:0;
  pointer-events:none;
}

.box{
  width:min(330px,78vw);
  height:min(480px,70vh);
  position:relative;
  perspective:1000px;
}

.box-base{
  position:absolute;
  bottom:0;
  width:100%;
  height:72%;
  border-radius:18px;
  background:linear-gradient(135deg,#eee,#aaa);
  box-shadow:0 35px 60px rgba(0,0,0,.4);
}

.box-lid{
  position:absolute;
  top:0;
  left:-4%;
  width:108%;
  height:35%;
  border-radius:18px;
  background:linear-gradient(135deg,#fff,#bcbcbc);
  transform-origin:bottom;
  transition:1.5s cubic-bezier(.2,.8,.2,1);
  z-index:5;
  box-shadow:0 15px 30px rgba(0,0,0,.3);
}

.box.open .box-lid{
  transform:rotateX(75deg) translateY(-180px);
}

.box-logo{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:85px;
  color:#111;
}

.box-phone{
  position:absolute;
  width:72%;
  height:88%;
  left:14%;
  bottom:5%;
  border-radius:42px;
  background:
    radial-gradient(circle at 30% 20%,#8bc7ff,#3472ff 40%,#07142f 100%);
  border:6px solid #111;
  transform:translateY(100px) scale(.8);
  opacity:0;
  transition:1.2s .5s cubic-bezier(.2,.8,.2,1);
  z-index:3;
}

.box.open .box-phone{
  transform:translateY(-20px) scale(1);
  opacity:1;
}

.box-phone::before{
  content:"";
  position:absolute;
  width:105px;
  height:28px;
  background:#000;
  border-radius:20px;
  top:12px;
  left:50%;
  transform:translateX(-50%);
}

.unbox-content{
  position:absolute;
  bottom:7%;
  left:0;
  right:0;
  text-align:center;
  z-index:20;
  color:#111;
}

.unbox-content h1{
  margin:0;
  font-size:28px;
}

.unbox-content p{
  margin:8px 0 18px;
}

#openBox{
  padding:14px 28px;
  border-radius:30px;
  background:#111;
  color:white;
  font-weight:700;
  box-shadow:0 10px 25px #0004;
}

#openBox:active{
  transform:scale(.94);
}

/* IOS */

#ios{
  position:absolute;
  inset:0;
  background:#000;
  display:none;
}

#ios.visible{
  display:block;
}

.wallpaper{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 25% 20%,rgba(255,255,255,.5),transparent 25%),
    radial-gradient(circle at 75% 70%,#6b4cff,transparent 35%),
    radial-gradient(circle at 30% 80%,#00aaff,transparent 40%),
    linear-gradient(135deg,#090b22,#40118c 55%,#081c3d);
}

.dark .wallpaper{
  filter:brightness(.65);
}

/* STATUS BAR */

.status{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:50px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  z-index:1000;
  font-size:14px;
  font-weight:600;
}

.status-right{
  display:flex;
  gap:7px;
  align-items:center;
}

.signal{
  letter-spacing:-3px;
}

.battery{
  width:25px;
  height:12px;
  border:1.5px solid white;
  border-radius:4px;
  position:relative;
}

.battery::after{
  content:"";
  position:absolute;
  right:-4px;
  top:3px;
  width:2px;
  height:5px;
  background:white;
  border-radius:1px;
}

.battery-fill{
  height:100%;
  width:78%;
  background:white;
  border-radius:2px;
}

/* LOCK SCREEN */

#lock{
  position:absolute;
  inset:0;
  z-index:900;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:80px;
  transition:.45s;
}

#lock.unlocking{
  transform:translateY(-100%);
  opacity:0;
}

.lock-time{
  font-size:72px;
  font-weight:300;
  letter-spacing:-4px;
}

.lock-date{
  font-size:18px;
  margin-top:-8px;
}

.lock-notification{
  width:calc(100% - 30px);
  margin-top:50px;
  padding:15px;
  border-radius:22px;
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(20px);
}

.lock-bottom{
  position:absolute;
  bottom:30px;
  width:100%;
  display:flex;
  justify-content:space-around;
}

.circle-btn{
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(255,255,255,.22);
  color:white;
  font-size:22px;
}

.swipe{
  position:absolute;
  bottom:7px;
  font-size:12px;
  opacity:.7;
}

/* HOME */

#home{
  position:absolute;
  inset:0;
  padding:70px 14px 80px;
  display:none;
  z-index:100;
}

#home.visible{
  display:block;
}

.widgets{
  height:80px;
  display:flex;
  gap:10px;
  margin-bottom:14px;
}

.widget{
  flex:1;
  border-radius:20px;
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(15px);
  padding:10px;
  overflow:hidden;
}

.widget strong{
  display:block;
  font-size:12px;
}

.widget span{
  font-size:22px;
  font-weight:600;
}

.app-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px 12px;
}

.app{
  display:flex;
  flex-direction:column;
  align-items:center;
  color:white;
  background:none;
}

.icon{
  width:58px;
  height:58px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  box-shadow:0 5px 12px #0004;
  position:relative;
}

.app span{
  margin-top:5px;
  font-size:11px;
  text-shadow:0 1px 4px #000;
}

.badge{
  position:absolute;
  right:-5px;
  top:-5px;
  min-width:19px;
  height:19px;
  padding:2px 5px;
  border-radius:12px;
  background:#ff304f;
  color:white;
  font-size:11px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* DOCK */

#dock{
  position:absolute;
  left:14px;
  right:14px;
  bottom:20px;
  height:78px;
  border-radius:27px;
  background:rgba(255,255,255,.2);
  backdrop-filter:blur(25px);
  z-index:500;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

#dock .icon{
  width:57px;
  height:57px;
}

/* APP WINDOW */

#appWindow{
  position:absolute;
  inset:0;
  z-index:3000;
  display:none;
  background:#f5f5f7;
  color:#111;
  animation:appOpen .35s;
}

#appWindow.open{
  display:block;
}

@keyframes appOpen{
  from{transform:scale(.75);opacity:0}
  to{transform:scale(1);opacity:1}
}

.app-header{
  height:75px;
  padding:35px 18px 10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #ddd;
}

.app-header h2{
  margin:0;
  font-size:22px;
}

.close-app{
  color:#007aff;
  background:none;
  font-weight:600;
}

.app-content{
  height:calc(100% - 75px);
  overflow:auto;
  padding:18px;
}

/* SEARCH */

#search{
  position:absolute;
  inset:0;
  z-index:2000;
  display:none;
  background:rgba(10,10,15,.96);
  backdrop-filter:blur(30px);
  padding:70px 20px;
}

#search.open{
  display:block;
}

.search-input{
  width:100%;
  padding:14px 18px;
  border:0;
  border-radius:18px;
  background:#333;
  color:white;
  outline:none;
}

.search-results{
  margin-top:15px;
}

/* CONTROL CENTER */

#controlCenter{
  position:absolute;
  inset:0;
  z-index:5000;
  display:none;
  padding:65px 15px;
  background:rgba(20,20,30,.9);
  backdrop-filter:blur(35px);
}

#controlCenter.open{
  display:block;
}

.cc-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.cc-card{
  padding:18px;
  border-radius:24px;
  background:#333;
}

.cc-toggle{
  padding:20px;
  border-radius:20px;
  background:#444;
  color:white;
  text-align:left;
}

.cc-toggle.active{
  background:#087cff;
}

.brightness{
  width:100%;
  margin-top:20px;
}

/* PASSCODE */

#passcode{
  position:absolute;
  inset:0;
  z-index:10000;
  display:none;
  background:rgba(0,0,0,.9);
  backdrop-filter:blur(30px);
  align-items:center;
  flex-direction:column;
  padding-top:120px;
}

#passcode.open{
  display:flex;
}

.pass-title{
  font-size:25px;
  margin-bottom:25px;
}

.pass-dots{
  display:flex;
  gap:12px;
  margin-bottom:35px;
}

.pass-dot{
  width:13px;
  height:13px;
  border:1px solid white;
  border-radius:50%;
}

.pass-dot.filled{
  background:white;
}

.keypad{
  width:270px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:13px;
}

.key{
  width:75px;
  height:75px;
  border-radius:50%;
  background:#333;
  color:white;
  font-size:27px;
}

.key:active{
  background:#666;
  transform:scale(.95);
}

.pass-cancel{
  margin-top:20px;
  background:none;
  color:#0a84ff;
}

/* SETTINGS */

.settings-section{
  background:white;
  border-radius:14px;
  overflow:hidden;
  margin-bottom:20px;
}

.setting-row{
  min-height:55px;
  padding:12px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #ddd;
}

.setting-row:last-child{
  border-bottom:0;
}

.setting-left{
  display:flex;
  gap:12px;
  align-items:center;
}

.setting-icon{
  width:34px;
  height:34px;
  border-radius:9px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#007aff;
  color:white;
}

.switch{
  width:50px;
  height:30px;
  background:#bbb;
  border-radius:20px;
  padding:3px;
  transition:.25s;
}

.switch i{
  display:block;
  width:24px;
  height:24px;
  border-radius:50%;
  background:white;
  transition:.25s;
}

.switch.on{
  background:#34c759;
}

.switch.on i{
  transform:translateX(20px);
}

/* CALCULATOR */

.calc{
  display:flex;
  flex-direction:column;
  height:100%;
  justify-content:flex-end;
}

.calc-display{
  text-align:right;
  font-size:55px;
  padding:15px;
  overflow:hidden;
}

.calc-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.calc-btn{
  height:68px;
  border-radius:50%;
  background:#333;
  color:white;
  font-size:25px;
}

.calc-btn.operator{
  background:#ff9500;
}

.calc-btn.gray{
  background:#aaa;
  color:#111;
}

/* NOTES */

.note-input{
  width:100%;
  min-height:300px;
  border:0;
  outline:none;
  resize:none;
  font-size:18px;
}

/* MUSIC */

.album{
  width:220px;
  height:220px;
  margin:25px auto;
  border-radius:18px;
  background:
    linear-gradient(135deg,#ff3b30,#af52de,#5856d6);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:75px;
  box-shadow:0 20px 35px #0003;
}

.music-title{
  text-align:center;
  font-size:22px;
  font-weight:700;
}

.music-artist{
  text-align:center;
  color:#777;
}

.progress{
  width:100%;
  margin-top:25px;
}

.music-controls{
  display:flex;
  justify-content:center;
  gap:35px;
  margin-top:25px;
}

.music-controls button{
  font-size:28px;
  background:none;
}

/* MESSAGES */

.message-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.message{
  padding:12px 15px;
  border-radius:20px;
  max-width:75%;
  background:#ddd;
}

.message.me{
  margin-left:auto;
  background:#007aff;
  color:white;
}

/* SAFARI */

.browser{
  display:flex;
  gap:7px;
  margin-bottom:15px;
}

.browser input{
  flex:1;
  padding:11px;
  border-radius:14px;
  border:1px solid #ccc;
}

.browser button{
  padding:10px 14px;
  border-radius:14px;
  background:#007aff;
  color:white;
}

.browser-page{
  min-height:400px;
  border-radius:18px;
  background:white;
  padding:25px;
  text-align:center;
}

/* CAMERA */

.camera{
  background:#000;
  color:white;
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  padding-bottom:40px;
}

.camera-preview{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 70% 20%,#777,transparent 20%),
    linear-gradient(130deg,#222,#777,#222);
  animation:cameraMove 6s infinite alternate;
}

@keyframes cameraMove{
  from{filter:brightness(.8)}
  to{filter:brightness(1.2)}
}

.shutter{
  width:80px;
  height:80px;
  border:6px solid white;
  border-radius:50%;
  background:white;
  box-shadow:inset 0 0 0 5px #111;
  position:relative;
  z-index:2;
}

/* HOME INDICATOR */

.home-indicator{
  position:absolute;
  width:135px;
  height:5px;
  border-radius:5px;
  background:white;
  bottom:8px;
  left:50%;
  transform:translateX(-50%);
  z-index:99999;
}

/* TOAST */

#toast{
  position:absolute;
  top:70px;
  left:50%;
  transform:translateX(-50%) translateY(-20px);
  background:rgba(30,30,30,.9);
  color:white;
  padding:12px 18px;
  border-radius:20px;
  z-index:30000;
  opacity:0;
  pointer-events:none;
  transition:.3s;
  white-space:nowrap;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* RESPONSIVE */

@media(max-height:650px){
  .phone{
    height:96vh;
  }
  .app-grid{
    gap:8px;
  }
  .icon{
    width:48px;
    height:48px;
    font-size:22px;
  }
}

@media(min-width:700px){
  .phone{
    transform:scale(1.03);
  }
}

/* LIGHT APP */

body.lightApps #appWindow{
  background:#f5f5f7;
}

/* SCROLLBAR */

::-webkit-scrollbar{
  width:0;
}

/* INSTALL SCREEN */

#setup{
  position:absolute;
  inset:0;
  z-index:15000;
  background:
    radial-gradient(circle at 50% 20%,#5667ff,#111 65%);
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
}

#setup.open{
  display:flex;
}

.setup-box h1{
  font-size:38px;
  margin-bottom:8px;
}

.setup-box p{
  opacity:.8;
  line-height:1.5;
}

.setup-button{
  margin-top:25px;
  padding:15px 25px;
  border-radius:30px;
  background:white;
  color:#111;
  font-weight:700;
}

/* APP GENERIC */

.generic-card{
  padding:18px;
  background:white;
  border-radius:18px;
  margin-bottom:12px;
}

.dark .generic-card{
  background:#222;
  color:white;
}

.big-number{
  font-size:42px;
  font-weight:700;
}

.row-button{
  width:100%;
  text-align:left;
  padding:15px;
  background:white;
  border-radius:15px;
  margin-bottom:8px;
}

/* HIDDEN */

.hidden{
  display:none!important;
}
</style>
</head>

<body>

<div id="stage">

<!-- UNBOXING -->

<div id="unboxing">

  <div class="box" id="box">

    <div class="box-base"></div>

    <div class="box-phone"></div>

    <div class="box-lid">
      <div class="box-logo"></div>
    </div>

    <div class="unbox-content">
      <h1>iPhone</h1>
      <p>Your new iPhone is ready.</p>
      <button id="openBox">Open Box</button>
    </div>

  </div>

</div>


<!-- PHONE -->

<div class="phone hidden" id="phone">

  <div class="side power"></div>
  <div class="side volume"></div>
  <div class="side volume2"></div>

  <div class="phone-screen">

    <div class="dynamic-island" id="island"></div>

    <div id="ios">

      <div class="wallpaper"></div>

      <!-- STATUS -->

      <div class="status">

        <span id="timeStatus">9:41</span>

        <div class="status-right">
          <span class="signal">▮▮▮</span>
          <span>Wi-Fi</span>
          <div class="battery">
            <div class="battery-fill" id="batteryFill"></div>
          </div>
        </div>

      </div>


      <!-- LOCK SCREEN -->

      <div id="lock">

        <div class="lock-time" id="lockTime">9:41</div>
        <div class="lock-date" id="lockDate">Friday, September 4</div>

        <div class="lock-notification">
          <b>Welcome to your iPhone</b>
          <br>
          <small>Swipe up to unlock</small>
        </div>

        <div class="lock-bottom">

          <button class="circle-btn" id="flashBtn">🔦</button>
          <button class="circle-btn" id="cameraLockBtn">📷</button>

        </div>

        <div class="swipe">━━━━━━</div>

      </div>


      <!-- HOME -->

      <div id="home">

        <div class="widgets">

          <div class="widget">
            <strong>Weather</strong>
            <span>72°</span>
          </div>

          <div class="widget">
            <strong>Calendar</strong>
            <span id="widgetDay">4</span>
          </div>

        </div>

        <div class="app-grid" id="appGrid"></div>

      </div>


      <!-- DOCK -->

      <div id="dock">

        <button class="app" data-app="Phone">
          <div class="icon">📞</div>
        </button>

        <button class="app" data-app="Messages">
          <div class="icon">
            💬
            <i class="badge">3</i>
          </div>
        </button>

        <button class="app" data-app="Safari">
          <div class="icon">🧭</div>

  const now = new Date();

  let h = now.getHours();
  const m = String(now.getMinutes()).padStart(2,"0");

  const ampm = h >= 12 ? "PM" : "AM";

  h = h % 12 || 12;

  const time = `${h}:${m}`;

  document.getElementById("lockTime").textContent = time;
  document.getElementById("timeStatus").textContent = time;

  const date = now.toLocaleDateString("en-US",{
    weekday:"long",
    month:"long",
    day:"numeric"
  });

  document.getElementById("lockDate").textContent = date;

  document.getElementById("widgetDay").textContent = now.getDate();

}

  if(passMode==="create"){

    passMode="unlock";

    passcode.classList.remove("open");

    enterHome();

    showToast("Passcode created");

    return;

    passcode.classList.remove("open");

    enterHome();

    currentPass="";

    currentPass="";

    updatePassDots();

/* ---------- APP EVENTS ---------- */

function attachAppEvents(name){

  if(name==="Calculator" || name==="Calculator Pro"){

    document.querySelectorAll("[data-calc]")
      .forEach(btn=>{

        btn.addEventListener("click",()=>{

          const v=btn.dataset.calc;

          calculate(v);

        });

      });

  }


  if(name==="Notes"){

    document.getElementById("saveNote")
      .addEventListener("click",()=>{

        noteText=
          document.getElementById("noteInput").value;

        localStorage.setItem(
          "iphoneNote",

        showToast("Note saved");

  }


  if(name==="Music"){

    document.getElementById("playMusic")
      .addEventListener("click",()=>{

        openApp("Music");

      });

  }


  if(name==="Camera"){

    document.getElementById("shutter")
      .addEventListener("click",()=>{

        showToast("📸 Photo captured!");

        island.classList.add("active");

        setTimeout(
          ()=>island.classList.remove("active"),

      });

  }


  if(
    name==="Safari" ||
    name==="Browser" ||
    name==="Safari Dev"
  ){

    document.getElementById("browserGo")
      .addEventListener("click",()=>{

        const q=

        if(!q) return;

        document.getElementById("browserPage")
          .innerHTML=`

            <div style="font-size:60px">
              🌐
            </div>

            <h2>
              ${escapeHTML(q)}
            </h2>

            <p>
              Simulated Safari result
            </p>

            <div class="generic-card">
              This browser is running entirely
              inside the simulator.
            </div>

          `;

      });

  }


  if(name==="Settings"){

    setupSettings();

  }


}


/* ---------- CALCULATOR ---------- */

function calculate(v){

  const display=
    document.getElementById("calcDisplay");

  if(v==="AC"){

    calcValue="";
    display.textContent="0";
    return;

  }

  if(v==="="){

    try{

      calcValue=String(
        Function(
          '"use strict";return ('+
          calcValue+
          ')'
        )()
      );

    }catch{

      calcValue="Error";

    }

    display.textContent=calcValue;

    return;

  }

  if(v==="+/-"){

    if(calcValue)
      calcValue=String(
        parseFloat(calcValue)*-1
      );

    display.textContent=calcValue||"0";

    return;

  }

  if(v==="%"){

    if(calcValue)
      calcValue=String(
        parseFloat(calcValue)/100
      );

    display.textContent=calcValue;

    return;

  }

  calcValue+=v;

  display.textContent=calcValue;

}

/* ---------- SWIPE / GESTURES ---------- */

let touchStartY=0;
let touchStartX=0;

ios.addEventListener("touchstart",e=>{

  touchStartY=e.touches[0].clientY;
  touchStartX=e.touches[0].clientX;

},{passive:true});


ios.addEventListener("touchend",e=>{

  const endY=e.changedTouches[0].clientY;
  const endX=e.changedTouches[0].clientX;

  const dy=endY-touchStartY;
  const dx=endX-touchStartX;

  /* swipe up from home */

  if(
    Math.abs(dy)>100 &&
    dy<0 &&
    !appWindow.classList.contains("open")
  ){

    openSearch();

  }

  /* swipe down */

  if(
    Math.abs(dy)>100 &&
    dy>0 &&
    !appWindow.classList.contains("open")
  ){

    document
      .getElementById("controlCenter")
      .classList.add("open");

  }

});


/* ---------- KEYBOARD ---------- */

document.addEventListener("keydown",e=>{

  if(e.key==="Escape"){

    search.classList.remove("open");

    closeControlCenter();

    closeAppWindow();

  }

  if(
    e.key.toLowerCase()==="s" &&
    !e.metaKey &&
    !e.ctrlKey
  ){

    if(!appWindow.classList.contains("open"))
      openSearch();

  }

});

/* ---------- ESCAPE ---------- */

function escapeHTML(str){

  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function escapeAttribute(str){

  return String(str)
    .replaceAll("'","\\'")
    .replaceAll('"','\\"');

}
